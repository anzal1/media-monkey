name: 🐵 Daily Reel

on:
  schedule:
    # 4x daily, spaced across IST audience windows (times are UTC).
    # Bump or cut by adding/removing a line; IG quota is 100 posts/24h.
    - cron: "0 3 * * *"    # 08:30 IST  morning commute
    - cron: "30 7 * * *"   # 13:00 IST  lunch
    - cron: "30 13 * * *"  # 19:00 IST  evening peak
    - cron: "30 17 * * *"  # 23:00 IST  late-night scroll
  workflow_dispatch:
    inputs:
      topic:
        description: "Optional topic (blank = auto trending)"
        required: false
      dry_run:
        description: "Render only, do not publish to Instagram"
        type: boolean
        default: false
      format:
        description: "explainer | brainrot | blank = house mix"
        required: false

permissions:
  contents: write

concurrency:
  group: reel
  cancel-in-progress: false

jobs:
  reel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Cache Kokoro model
        uses: actions/cache@v4
        with:
          path: ~/.cache/voila/models
          key: kokoro-82m-v1-q8

      - run: npm ci

      - name: Fetch clip bank (harvested + public-domain tiers)
        run: |
          git fetch --depth 1 origin clips 2>/dev/null \
            && git checkout FETCH_HEAD -- assets/clips \
            && echo "clip bank: $(ls assets/clips/*.mp4 2>/dev/null | wc -l | tr -d ' ') clips" \
            || echo "no clips branch yet, physics tier only"

      - name: System ffmpeg (for ffprobe)
        run: sudo apt-get update -qq && sudo apt-get install -yqq ffmpeg

      - name: Render reel
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MEDIAMONKEY_FFPROBE: /usr/bin/ffprobe
        run: |
          FMT=""
          if [ -n "${{ github.event.inputs.format }}" ]; then FMT="--format ${{ github.event.inputs.format }}"; fi
          if [ -n "${{ github.event.inputs.topic }}" ]; then
            node factory/make.mjs "${{ github.event.inputs.topic }}" $FMT
          else
            node factory/make.mjs --auto $FMT
          fi
          REEL=$(find out -name reel.mp4 -newer package.json | head -1)
          echo "REEL=$REEL" >> "$GITHUB_ENV"
          echo "SLUG=$(basename $(dirname $REEL))" >> "$GITHUB_ENV"

      - name: Keep reel as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.SLUG }}
          path: |
            ${{ env.REEL }}
            out/**/caption.txt

      - name: Host reel at a public raw URL (reels branch)
        run: |
          cp "$REEL" "$RUNNER_TEMP/$SLUG.mp4"
          cp "$(dirname "$REEL")/caption.txt" "$RUNNER_TEMP/$SLUG.txt"
          git config user.name "media-monkey-bot"
          git config user.email "anzalabidi@gmail.com"
          git fetch origin reels || true
          git checkout -B reels origin/reels 2>/dev/null || git checkout --orphan reels
          git rm -rq --cached . 2>/dev/null || true
          find . -maxdepth 1 ! -name '.git' ! -name '.' ! -name 'staging' -exec rm -rf {} + 2>/dev/null || true
          mkdir -p staging
          cp "$RUNNER_TEMP/$SLUG.mp4" "staging/$SLUG.mp4"
          cp "$RUNNER_TEMP/$SLUG.txt" "staging/$SLUG.txt"
          # Keep the 20 most recently COMMITTED files (10 reels) plus the one we
          # are about to publish. The old alphabetical prune could delete the
          # current reel before Meta fetched it.
          git log --name-only --pretty=format: -n 60 -- staging \
            | sed '/^$/d' | awk '!seen[$0]++' | head -20 > "$RUNNER_TEMP/keep.txt"
          for f in staging/*; do
            case "$f" in staging/"$SLUG".*) continue ;; esac
            grep -qxF "$f" "$RUNNER_TEMP/keep.txt" || rm -f "$f"
          done
          git add -A && git commit -qm "reel: $SLUG" && git push -qf origin reels
          echo "VIDEO_URL=https://raw.githubusercontent.com/${{ github.repository }}/reels/staging/$SLUG.mp4" >> "$GITHUB_ENV"
          git checkout -q ${{ github.sha }}

      - name: Publish to Instagram (skips politely without Meta secrets)
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            echo "dry run: rendered $SLUG, hosted at $VIDEO_URL, not publishing."
            exit 0
          fi
          node factory/publish.mjs --video-url "$VIDEO_URL" --caption-file "$RUNNER_TEMP/$SLUG.txt"
