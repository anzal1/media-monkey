<!doctype html>
<meta charset="utf-8">
<title>mm bg: orbs</title>
<!--
  Physics balls in a glass container. Fixed-timestep impulse solver, seeded
  spawn, deterministic given frames are stepped in order from 0. Not periodic
  (real physics is not), but the recording is 60s and no reel is longer than
  ~45s, so it is never looped inside a render.
-->
<style>
  html,body{margin:0;background:#04060a;overflow:hidden}
  canvas{display:block;width:1080px;height:1920px}
</style>
<canvas id="c" width="1080" height="1920"></canvas>
<script src="_harness.js"></script>
<script>
(() => {
  const W = 1080, H = 1920;
  const c = document.getElementById('c');
  const g = c.getContext('2d', { alpha: false });
  const TAU = Math.PI * 2;

  // container: a rounded box inset from the frame
  const BX = 90, BY = 300, BW = W - 180, BH = H - 640;
  const BR = 56;

  const r = rng(77712);
  const PALETTE = ['224,120,66', '236,168,104', '120,196,214', '238,244,250', '190,120,210'];
  const balls = [];
  const N = 34;
  for (let i = 0; i < N; i++) {
    const rad = 22 + r() * 46;
    balls.push({
      x: BX + rad + r() * (BW - 2 * rad),
      y: BY + rad + r() * (BH * 0.55),
      vx: (r() - 0.5) * 16,
      vy: (r() - 0.5) * 8,
      r: rad,
      m: rad * rad,
      col: PALETTE[Math.floor(r() * PALETTE.length)],
      spin: (r() - 0.5) * 0.06,
      a: r() * TAU,
    });
  }

  const GRAV = 0.62;
  const REST = 0.9;
  const SUB = 3;               // substeps per frame for stable stacking
  const KICK = 96;             // frames between shakes: 1.6s at 60fps

  let step = 0;

  function physics() {
    // container tilts slowly, so the pile keeps collapsing and rebuilding
    const tilt = Math.sin(step / 240) * 0.34;
    const gx = Math.sin(tilt) * GRAV, gy = Math.cos(tilt) * GRAV;

    // A damped pit settles into a static pile within ~20s, which is dead air on
    // screen. Shake it on a fixed cadence so the loop never stops moving. The
    // impulse is derived from the step index, so it stays deterministic.
    if (step % KICK === 0) {
      const k = rng(step * 2654435761 + 1);
      const dir = Math.sin(step / KICK) * 0.5;
      for (const b of balls) {
        b.vy -= 11 + k() * 13;
        b.vx += (k() - 0.5) * 16 + dir * 9;
        b.spin += (k() - 0.5) * 0.05;
      }
    }

    for (let s = 0; s < SUB; s++) {
      for (const b of balls) {
        b.vx += gx / SUB; b.vy += gy / SUB;
        b.vx *= 0.9995; b.vy *= 0.9995;
        b.x += b.vx / SUB; b.y += b.vy / SUB;
        b.a += b.spin / SUB;

        if (b.x - b.r < BX) { b.x = BX + b.r; b.vx = Math.abs(b.vx) * REST; }
        if (b.x + b.r > BX + BW) { b.x = BX + BW - b.r; b.vx = -Math.abs(b.vx) * REST; }
        if (b.y - b.r < BY) { b.y = BY + b.r; b.vy = Math.abs(b.vy) * REST; }
        if (b.y + b.r > BY + BH) { b.y = BY + BH - b.r; b.vy = -Math.abs(b.vy) * REST; b.vx *= 0.985; }
      }
      for (let i = 0; i < N; i++) {
        for (let j = i + 1; j < N; j++) {
          const a = balls[i], b = balls[j];
          let dx = b.x - a.x, dy = b.y - a.y;
          const rr = a.r + b.r;
          let d2 = dx * dx + dy * dy;
          if (d2 >= rr * rr || d2 === 0) continue;
          const d = Math.sqrt(d2);
          const nx = dx / d, ny = dy / d;
          const overlap = rr - d;
          const tm = a.m + b.m;
          a.x -= nx * overlap * (b.m / tm); a.y -= ny * overlap * (b.m / tm);
          b.x += nx * overlap * (a.m / tm); b.y += ny * overlap * (a.m / tm);
          const rvx = b.vx - a.vx, rvy = b.vy - a.vy;
          const vn = rvx * nx + rvy * ny;
          if (vn > 0) continue;
          const imp = (-(1 + REST) * vn) / (1 / a.m + 1 / b.m);
          a.vx -= (imp * nx) / a.m; a.vy -= (imp * ny) / a.m;
          b.vx += (imp * nx) / b.m; b.vy += (imp * ny) / b.m;
        }
      }
    }
    step++;
  }

  function roundRect(ctx, x, y, w, h, rad) {
    ctx.beginPath();
    ctx.moveTo(x + rad, y);
    ctx.arcTo(x + w, y, x + w, y + h, rad);
    ctx.arcTo(x + w, y + h, x, y + h, rad);
    ctx.arcTo(x, y + h, x, y, rad);
    ctx.arcTo(x, y, x + w, y, rad);
    ctx.closePath();
  }

  function frame(i) {
    physics();

    g.fillStyle = '#04060a';
    g.fillRect(0, 0, W, H);

    // container glow
    g.save();
    g.globalCompositeOperation = 'lighter';
    roundRect(g, BX - 6, BY - 6, BW + 12, BH + 12, BR + 6);
    g.strokeStyle = 'rgba(224,120,66,0.20)';
    g.lineWidth = 14;
    g.stroke();
    g.restore();

    roundRect(g, BX, BY, BW, BH, BR);
    g.save();
    g.clip();
    g.fillStyle = '#070a10';
    g.fillRect(BX, BY, BW, BH);

    g.globalCompositeOperation = 'lighter';
    for (const b of balls) {
      const gr = g.createRadialGradient(
        b.x - b.r * 0.34, b.y - b.r * 0.34, b.r * 0.06,
        b.x, b.y, b.r,
      );
      gr.addColorStop(0, `rgba(${b.col},0.98)`);
      gr.addColorStop(0.55, `rgba(${b.col},0.42)`);
      gr.addColorStop(1, `rgba(${b.col},0.05)`);
      g.fillStyle = gr;
      g.beginPath();
      g.arc(b.x, b.y, b.r, 0, TAU);
      g.fill();

      // spin mark so motion reads even when a ball is resting
      g.strokeStyle = `rgba(${b.col},0.55)`;
      g.lineWidth = 3;
      g.beginPath();
      g.arc(b.x, b.y, b.r * 0.58, b.a, b.a + 1.9);
      g.stroke();
    }
    g.restore();

    // container edge on top
    roundRect(g, BX, BY, BW, BH, BR);
    g.strokeStyle = 'rgba(200,220,235,0.16)';
    g.lineWidth = 3;
    g.stroke();
  }

  mmBoot({ frame, name: 'orbs' });
})();
</script>
