<!doctype html>
<meta charset="utf-8">
<title>mm bg: rings</title>
<!--
  ESCAPE THE RINGS. A glowing ball bounces inside a stack of concentric rings,
  each with one gap, each rotating at its own rate. When the ball threads a gap
  that ring shatters into particles, the screen kicks, and the ball speeds up.
  The whole stack then flows inward by one slot and a fresh ring fades in at the
  rim, so the run never ends and the ball stays centred in frame.
  Every frame something is one bounce away from escaping: that anticipation is
  the entire point of the format.

  On "new rings spawn from the centre": the stack flows INWARD, so a literal
  centre spawn would trap the ball inside a shrinking circle. The centre pulse
  fired on every shatter carries that read instead, and the replacement ring
  fades in at the rim.

  Deterministic: ?seed=N selects a variant, frames are stepped in order, and
  nothing reads the clock or Math.random.
-->
<style>
  html,body{margin:0;background:#04050a;overflow:hidden}
  canvas{display:block;width:1080px;height:1920px}
</style>
<canvas id="c" width="1080" height="1920"></canvas>
<script src="_harness.js"></script>
<script>
(() => {
  const W = 1080, H = 1920, CX = W / 2, CY = H / 2;
  const c = document.getElementById('c');
  const g = c.getContext('2d', { alpha: false });
  const TAU = Math.PI * 2;

  const r = rng(MM_SEED * 2654435761 + 12345);

  // --- tuning -----------------------------------------------------------
  const R0 = 176;            // radius of the innermost ring
  const SPACING = 60;        // gap between rings
  const COUNT = 8;           // rings alive at once
  const BALL_R = 19;
  const RING_W = 11;
  // Pacing is the whole design. A gap this wide plus this ball speed lands a
  // shatter every 2 to 4 seconds: long enough to build the near-miss tension,
  // short enough that a 40 second reel never goes a beat without a payoff.
  const START_SPEED = 11.4;  // px per frame at 60fps
  const SPEED_GAIN = 1.045;
  const MAX_SPEED = 17.5;
  const SUB = 5;             // collision substeps

  const HUES = [18, 32, 288, 190, 145, 52];
  const baseHue = HUES[Math.floor(r() * HUES.length)];

  function makeRing(slot) {
    return {
      rad: R0 + slot * SPACING,
      target: R0 + slot * SPACING,
      rot: r() * TAU,
      spin: (0.006 + r() * 0.016) * (r() < 0.5 ? -1 : 1),
      gapHalf: 0.44 + r() * 0.20,
      hue: (baseHue + slot * 17 + r() * 12) % 360,
      alpha: 1,
      alive: true,
    };
  }

  let rings = [];
  for (let i = 0; i < COUNT; i++) rings.push(makeRing(i));
  let nextSlot = COUNT;

  const ball = {
    x: CX + (r() - 0.5) * 60,
    y: CY + (r() - 0.5) * 60,
    speed: START_SPEED,
    ang: r() * TAU,
    trail: [],
  };
  ball.vx = Math.cos(ball.ang) * ball.speed;
  ball.vy = Math.sin(ball.ang) * ball.speed;

  const parts = [];
  const pulses = [];
  let shake = 0;
  let broken = 0;

  // deterministic jitter keyed to the frame index, for the screen shake
  function jitter(i, salt) {
    const x = Math.sin(i * 12.9898 + salt * 78.233) * 43758.5453;
    return (x - Math.floor(x)) * 2 - 1;
  }

  function angDiff(a, b) {
    let d = (a - b) % TAU;
    if (d > Math.PI) d -= TAU;
    if (d < -Math.PI) d += TAU;
    return d;
  }

  function innermost() {
    for (const ring of rings) if (ring.alive) return ring;
    return null;
  }

  function shatter(ring) {
    broken++;
    shake = 22;
    pulses.push({ rad: 0, max: ring.rad + 140, life: 1, hue: ring.hue });
    const n = 110;
    for (let i = 0; i < n; i++) {
      const a = (i / n) * TAU;
      if (Math.abs(angDiff(a, ring.rot)) < ring.gapHalf) continue;  // gap has no wall
      const sp = 2.2 + r() * 7.5;
      parts.push({
        x: CX + Math.cos(a) * ring.rad,
        y: CY + Math.sin(a) * ring.rad,
        vx: Math.cos(a) * sp - Math.sin(a) * (r() - 0.5) * 4,
        vy: Math.sin(a) * sp + Math.cos(a) * (r() - 0.5) * 4,
        life: 1,
        decay: 0.012 + r() * 0.012,
        size: 2 + r() * 5,
        hue: ring.hue,
      });
    }
    ring.alive = false;
    ball.speed = Math.min(MAX_SPEED, ball.speed * SPEED_GAIN);

    // the stack flows inward one slot; a replacement fades in at the rim
    rings = rings.filter((x) => x.alive);
    for (const x of rings) x.target -= SPACING;
    const fresh = makeRing(nextSlot++);
    fresh.target = R0 + (rings.length) * SPACING;
    fresh.rad = fresh.target + 46;
    fresh.alpha = 0;
    rings.push(fresh);
  }

  function step() {
    for (const ring of rings) {
      ring.rot += ring.spin;
      ring.rad += (ring.target - ring.rad) * 0.09;
      if (ring.alpha < 1) ring.alpha = Math.min(1, ring.alpha + 0.05);
    }

    const speed = ball.speed;
    const v = Math.hypot(ball.vx, ball.vy) || 1;
    ball.vx = (ball.vx / v) * speed;
    ball.vy = (ball.vy / v) * speed;

    for (let s = 0; s < SUB; s++) {
      ball.x += ball.vx / SUB;
      ball.y += ball.vy / SUB;

      const ring = innermost();
      if (!ring) continue;
      const dx = ball.x - CX, dy = ball.y - CY;
      const d = Math.hypot(dx, dy) || 0.0001;
      const wall = ring.rad - RING_W / 2;
      if (d + BALL_R < wall) continue;

      const a = Math.atan2(dy, dx);
      // the ball must fit through the gap, not just touch it
      const clearance = ring.gapHalf - BALL_R / Math.max(40, ring.rad);
      if (clearance > 0.02 && Math.abs(angDiff(a, ring.rot)) < clearance) {
        shatter(ring);
        continue;
      }
      const nx = dx / d, ny = dy / d;
      ball.x = CX + nx * (wall - BALL_R);
      ball.y = CY + ny * (wall - BALL_R);
      const dot = ball.vx * nx + ball.vy * ny;
      ball.vx -= 2 * dot * nx;
      ball.vy -= 2 * dot * ny;
      // a touch of the ring's spin so bounces never settle into a pattern
      ball.vx += -ny * ring.spin * 26;
      ball.vy += nx * ring.spin * 26;
    }

    ball.trail.push({ x: ball.x, y: ball.y });
    if (ball.trail.length > 22) ball.trail.shift();

    for (let i = parts.length - 1; i >= 0; i--) {
      const p = parts[i];
      p.x += p.vx; p.y += p.vy;
      p.vx *= 0.982; p.vy *= 0.982;
      p.life -= p.decay;
      if (p.life <= 0) parts.splice(i, 1);
    }
    for (let i = pulses.length - 1; i >= 0; i--) {
      const p = pulses[i];
      p.rad += (p.max - p.rad) * 0.09;
      p.life -= 0.026;
      if (p.life <= 0) pulses.splice(i, 1);
    }
    shake *= 0.87;
  }

  function draw(i) {
    g.fillStyle = '#04050a';
    g.fillRect(0, 0, W, H);

    g.save();
    if (shake > 0.4) g.translate(jitter(i, 1) * shake, jitter(i, 2) * shake);

    // faint core glow under everything
    const core = g.createRadialGradient(CX, CY, 0, CX, CY, 620);
    core.addColorStop(0, `hsla(${baseHue},90%,60%,0.14)`);
    core.addColorStop(1, 'hsla(0,0%,0%,0)');
    g.fillStyle = core;
    g.fillRect(0, 0, W, H);

    g.globalCompositeOperation = 'lighter';

    // shatter shockwaves
    for (const p of pulses) {
      g.strokeStyle = `hsla(${p.hue},100%,70%,${0.5 * p.life})`;
      g.lineWidth = 6 * p.life;
      g.beginPath();
      g.arc(CX, CY, p.rad, 0, TAU);
      g.stroke();
    }

    // rings, innermost brightest: that is the one in play
    rings.forEach((ring, idx) => {
      const lead = idx === 0;
      const a0 = ring.rot + ring.gapHalf;
      const a1 = ring.rot - ring.gapHalf + TAU;
      const alpha = ring.alpha * (lead ? 1 : 0.52 - idx * 0.045);
      if (alpha <= 0.02) return;
      g.lineCap = 'round';
      g.lineWidth = RING_W + (lead ? 3 : 0);
      g.strokeStyle = `hsla(${ring.hue},95%,${lead ? 64 : 56}%,${Math.max(0, alpha)})`;
      g.beginPath();
      g.arc(CX, CY, ring.rad, a0, a1);
      g.stroke();
      if (lead) {
        // bright gap mouths so the escape route is always legible
        g.lineWidth = RING_W + 9;
        g.strokeStyle = `hsla(${ring.hue},100%,74%,0.5)`;
        g.beginPath();
        g.arc(CX, CY, ring.rad, a0 - 0.07, a0 + 0.05);
        g.stroke();
        g.beginPath();
        g.arc(CX, CY, ring.rad, a1 - 0.05, a1 + 0.07);
        g.stroke();
      }
    });

    // particles
    for (const p of parts) {
      g.fillStyle = `hsla(${p.hue},100%,${58 + 30 * p.life}%,${p.life})`;
      g.beginPath();
      g.arc(p.x, p.y, p.size * (0.4 + p.life), 0, TAU);
      g.fill();
    }

    // ball trail
    for (let t = 0; t < ball.trail.length; t++) {
      const q = ball.trail[t];
      const k = t / ball.trail.length;
      g.fillStyle = `hsla(${(baseHue + 40) % 360},100%,72%,${0.42 * k * k})`;
      g.beginPath();
      g.arc(q.x, q.y, BALL_R * (0.25 + 0.75 * k), 0, TAU);
      g.fill();
    }

    // ball
    const bg = g.createRadialGradient(ball.x, ball.y, 0, ball.x, ball.y, BALL_R * 6);
    bg.addColorStop(0, 'rgba(255,255,255,0.95)');
    bg.addColorStop(0.13, `hsla(${(baseHue + 40) % 360},100%,70%,0.75)`);
    bg.addColorStop(1, 'hsla(0,0%,0%,0)');
    g.fillStyle = bg;
    g.beginPath();
    g.arc(ball.x, ball.y, BALL_R * 6, 0, TAU);
    g.fill();
    g.fillStyle = '#ffffff';
    g.beginPath();
    g.arc(ball.x, ball.y, BALL_R, 0, TAU);
    g.fill();

    g.globalCompositeOperation = 'source-over';
    g.restore();

    // the score: stakes, and it never resets
    g.font = '700 46px "Arial Black", Arial, sans-serif';
    g.textAlign = 'center';
    g.fillStyle = 'rgba(255,255,255,0.30)';
    g.fillText(`RINGS BROKEN  ${broken}`, CX, 238);
  }

  mmBoot({ frame(i) { step(); draw(i); }, name: 'rings' });
})();
</script>
