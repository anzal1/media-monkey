        cur = { s: r(from.s, to.s, t0, 1.4), e: r(from.e, to.e, t0 + 0.1, 1.3), p: r(from.p, to.p, t0, 1.3),
          t: r(from.t, to.t, t0 + (to.p > from.p ? 1.1 : 0.2), 0.9), bp: easeInOut(clamp01((local - t0) / 1.4)) };
        tgt = heroTarget(H, B, cur);
      }
      let st, vis;
      if (tgt) {
        st = tgt;
        if (H.from) {
          const e = easeInOut(clamp01(local / 0.9));
          st = { whole: lerpR(H.from.whole, tgt.whole, e), tiles: tgt.tiles.map((t, j) => lerpR(H.from.tiles[j], t, e)), meta: tgt.meta };
          vis = 1;
        } else vis = easeOut((local - 0.2) / 0.6);
      } else if (H.last) {
        st = H.last;
        cur = H.last.cur;
        vis = H.fade * (1 - clamp01(local / 0.3));
      } else return;
      H.root.style.opacity = vis.toFixed(3);
      if (vis <= 0) { H.last = { ...st, vis: 0, cur }; return; }

      const split = cur.p > 0.002;
      placeEl(H.whole, st.whole);
      H.whole.style.opacity = split ? 0 : 1;
      H.tiles.forEach((t, j) => { placeEl(t, st.tiles[j]); t.style.opacity = split ? 1 : 0; });

      // scramble: glyphs sweep across left to right and reshuffle ten times a second
      const e = cur.e;
      H.imgs.forEach((im) => { im.style.opacity = e > 0.001 ? (1 - 0.86 * e).toFixed(3) : ''; });
      H.glys.forEach((gl) => {
        gl.style.opacity = e > 0.001 ? 1 : 0;
        gl.style.clipPath = `inset(0 ${((1 - e) * 100).toFixed(2)}% 0 0)`;
      });
      if (e > 0.001 && mine) {
        const slot = Math.floor(Math.round(tSec * FPS) / 3);
        if (slot !== H.slot) {
          H.slot = slot;
          const abc = sc.hero.glyphs === 'bits' ? '01' : GLYPHS;
          const rnd = window.rng(9173 + slot * 31);
          H.glys.forEach((gl, j) => {
            let s = '';
            const lines = j ? 3 : 5, per = j ? 4 : 11;
            for (let l = 0; l < lines; l++) {
              if (l) s += '\n';
              for (let c = 0; c < per; c++) s += abc[Math.floor(rnd() * abc.length)];
            }
            gl.textContent = s;
          });
        }
      }

      // packet labels, once the pieces have separated
      const h = mine ? sc.hero : null;
      H.tags.forEach((tg, j) => {
        const t = st.tiles[j];
        const big = t.s * H.tw >= 64 && !(B.hAnchor && B.hAnchor.dataset.tags === '0');
        let o = clamp01((cur.p - 0.6) / 0.4) * (big ? 1 : 0);
        let tmpl = mine ? sc._h.tag : (H.lastTag || '#{i}');
        if (mine && sc._h.to.t > sc._h.from.t) {
          const at = Math.min(1.0, span * 0.22) + 1.1 + j * 0.12;
          if (local < at) tmpl = sc._h.tagFrom;
          else o *= easeOut((local - at) / 0.35);
        }
        const txt = tmpl.replace(/\{i\}/g, j + 1).replace(/\{n\}/g, H.n);
        if (tg.textContent !== txt) tg.textContent = txt;
        tg.style.opacity = o.toFixed(3);
        tg.style.left = (t.x + (H.tw * t.s) / 2).toFixed(1) + 'px';
        tg.style.top = (t.y - 8).toFixed(1) + 'px';
      });
      if (mine) H.lastTag = sc._h.tag;

      // file name and a live byte counter under the object
      if (st.meta && h) {
        const xs = split ? st.tiles.map((t) => [t.x, t.x + H.tw * t.s]) : [[st.whole.x, st.whole.x + HW * st.whole.s]];
        const ys = split ? st.tiles.map((t) => t.y + H.th * t.s) : [st.whole.y + HH * st.whole.s];
        const lo = Math.min(...xs.map((a) => a[0])), hi = Math.max(...xs.map((a) => a[1]));
        H.meta.style.left = ((lo + hi) / 2).toFixed(1) + 'px';
        H.meta.style.top = (Math.max(...ys) + 18).toFixed(1) + 'px';
        H.meta.style.opacity = 1;
        const { bFrom, bTo } = sc._h;
        const bytes = bFrom && bTo ? Math.exp(lerp(Math.log(bFrom), Math.log(bTo), cur.bp)) : bTo;
        const label = cur.p > 0.5 ? `${H.n} PACKETS` : (h.label || '');
        const sp = H.meta.firstChild, bb = H.meta.lastChild;
        if (sp.textContent !== label) sp.textContent = label;
        const bt = bytes ? fmtBytes(bytes) : '';
        if (bb.textContent !== bt) bb.textContent = bt;
      } else if (!mine) {
        // keep whatever it said while it fades
      } else H.meta.style.opacity = 0;
      H.last = { whole: st.whole, tiles: st.tiles, meta: st.meta, vis, cur };
    });
  }

  /* ---- stack3d ---- */
  function animStack(B, d, local, span, tSec, w) {
    if (!B.s3) {
      B.s3 = {
        rigs: [...B.wrap.querySelectorAll('.s3rig')].map((el) => ({ el,
          plates: [...el.querySelectorAll('.s3plate')].map((p) => ({ el: p, z: +p.dataset.z, i: +p.dataset.i,
            shad: p.querySelector('.s3shad'), lab: p.querySelector('.s3lab'), bbs: [...p.querySelectorAll('.s3bb')],
            sides: [...p.querySelectorAll('.s3side')] })) })),
        tagNew: B.wrap.querySelector('.s3t.new'), tagOld: B.wrap.querySelector('.s3t.old'),
        pts: [...B.wrap.querySelectorAll('.s3pt')], names: [...B.wrap.querySelectorAll('.s3name')],
        core: B.wrap.querySelector('.s3wire .core'), glo: B.wrap.querySelector('.s3wire .glo'),
      };
    }
    const S3 = B.s3, twin = !!d.twin;
    const n = (d.plates || []).length || 1;
    const GAP = twin ? 66 : 136;
    const act = Math.max(0, Math.min(n - 1, d.active || 0));
    const tgt = { f: twin ? (n - 1) / 2 : act, D: d.zoom != null ? d.zoom : twin ? 0 : 150 };
    const from = B.s3from || { f: tgt.f, D: tgt.D - 360 };
    const c = w != null ? w : B.s3from ? easeInOut(clamp01(local / 1.5)) : easeOut(local / 1.9);
    const f = lerp(from.f, tgt.f, c), D = lerp(from.D, tgt.D, c);
    const ax = 56 + 1.2 * Math.sin(tSec * 0.17) * DRIFT, az = 45 + 2.6 * Math.sin(tSec * 0.23) * DRIFT;
    const bb = `rotateZ(${(-az).toFixed(3)}deg) rotateX(${(-ax).toFixed(3)}deg) translate(-50%, -100%)`;
    S3.rigs.forEach((R) => {
      R.el.style.transform = `translateZ(${D.toFixed(1)}px) rotateX(${ax.toFixed(3)}deg) rotateZ(${az.toFixed(3)}deg) translateZ(${(-(n - 1 - f) * GAP).toFixed(1)}px)`;
      R.plates.forEach((P) => {
        const q = B.s3from || w != null ? 1 : easeOut((local - 0.1 - (n - 1 - P.i) * 0.08) / 0.7);
        const fa = twin ? 0 : clamp01((f - P.i) * 1.5 - 0.3);
        let on = twin && P.i === 0 ? 0.6 : 0;
        if (!twin) {
          if (P.i === act) on = clamp01((c - 0.55) / 0.45);
          if (B.s3prevAct != null && P.i === B.s3prevAct && P.i !== act) on = Math.max(on, 1 - clamp01(c / 0.45));
        }
        // focus is lift and shadow: the active slab rises, and its shadow on
        // the slab below lengthens and softens
        const lift = 34 * on;
        P.el.style.transform = `translateZ(${(P.z + 160 * fa + lift - 40 * (1 - q)).toFixed(1)}px)`;
        P.el.style.opacity = (q * (1 - 0.94 * fa)).toFixed(3);
        P.el.classList.toggle('on', on >= 0.5);
        if (!P.sides[0].style.transform) {
          P.sides[0].style.transform = 'translateZ(-15px)';
          P.sides.slice(1).forEach((sd) => { sd.style.transform = `translateZ(-${sd.dataset.d}px)`; });
        }
        const drop = (P.i === n - 1 ? 30 : GAP) + lift;
        P.shad.style.transform = `translate3d(${(4 + lift * 0.35).toFixed(1)}px, ${(6 + lift * 0.35).toFixed(1)}px, ${(-drop + 2).toFixed(1)}px) scale(${(1 + lift * 0.0015).toFixed(4)})`;
        P.shad.style.filter = `blur(${(9 + lift * 0.45).toFixed(1)}px)`;
        P.shad.style.opacity = ((P.i === n - 1 ? 0.55 : 1) * (1 - 0.35 * on)).toFixed(3);
        P.bbs.forEach((e) => { e.style.transform = `translate3d(${e.dataset.x}px, ${e.dataset.y}px, 2px) ${bb}`; });
      });
    });
    if (S3.tagNew) {
      const e = eio(B.s3from ? (c - 0.3) / 0.5 : (local - 0.35) / 0.6);
      S3.tagNew.style.opacity = e.toFixed(3);
      S3.tagNew.style.transform = `translateY(${((1 - e) * 18).toFixed(1)}px)`;
      const o = easeInOut(clamp01(c / 0.4));
      S3.tagOld.style.opacity = (1 - o).toFixed(3);
      S3.tagOld.style.transform = `translateY(${(-18 * o).toFixed(1)}px)`;
    }
    if (twin && S3.pts.length >= 2 && S3.core) {
      const base = B.wrap.getBoundingClientRect();
      const pos = (e) => { const r = e.getBoundingClientRect(); return { x: r.left + r.width / 2 - base.left, y: r.top + r.height / 2 - base.top }; };
      const low = S3.pts.filter((e) => e.dataset.top !== '1').map(pos), high = S3.pts.filter((e) => e.dataset.top === '1').map(pos);
      const [pa, pb] = low;
      const dp = `M${pa.x.toFixed(1)},${pa.y.toFixed(1)} C${pa.x.toFixed(1)},${(pa.y + 250).toFixed(1)} ${pb.x.toFixed(1)},${(pb.y + 250).toFixed(1)} ${pb.x.toFixed(1)},${pb.y.toFixed(1)}`;
      S3.core.setAttribute('d', dp);
      S3.glo.setAttribute('d', dp);
      const len = S3.core.getTotalLength();
      const drawn = Math.max(w != null ? w : 0, easeInOut(clamp01((local - 0.5) / 1.4)));
      [S3.core, S3.glo].forEach((p) => { p.style.strokeDasharray = `${len.toFixed(1)}`; p.style.strokeDashoffset = (len * (1 - drawn)).toFixed(1); });
      S3.names.forEach((nm, j) => {
        const p = high[j] || (j ? pb : pa);
        nm.style.left = p.x.toFixed(1) + 'px';
        nm.style.top = (p.y - 150).toFixed(1) + 'px';
        nm.style.opacity = Math.max(w != null ? w : 0, easeOut((local - 0.6) / 0.6)).toFixed(3);
      });
    }
  }

  /* ---- phone ---- */
  // the handset is laid out at 392x780 and scaled up to about half the frame
  const PH_S = 1.3;
  function animPhone(B, d, local, span, tSec) {
    if (!B.ph) {
      const q = (s) => B.wrap.querySelector(s);
      B.ph = { root: q('.ph'), glow: q('.phglow'), bubs: [...B.wrap.querySelectorAll('.bub')], snd: q('.snd'),
        fld: q('.fld'), typing: q('.typing'), dots: [...B.wrap.querySelectorAll('.typing i')],
        sheet: q('.ppsheet'), btn: q('.ppbtn'), ring: q('.ppbtn svg'), lb: q('.ppbtn .lb'), ok: q('.ppok'),
        oc: q('.ppok .oc'), ot: q('.ppok .ot'), ban: q('.pban'), prog: q('.pbprog i'), blks: [...B.wrap.querySelectorAll('.pbpage .blk')] };
    }
    const P = B.ph;
    const app = d.app || 'chat';
    const intro = B.carry ? 1 : easeOut(local / 0.8);
    P.root.style.transform = `translateY(${((1 - intro) * 40).toFixed(1)}px) scale(${PH_S})`;
    P.glow.style.opacity = (0.8 * (B.carry ? 1 : easeOut((local - 0.3) / 0.9))).toFixed(3);
    if (app === 'chat') {
      const msgs = d.messages || [];
      const lastOf = (who) => { for (let i = msgs.length - 1; i >= 0; i--) if ((msgs[i].from === 'me') === (who === 'me')) return i; return -1; };
      const sendI = d.send ? lastOf('me') : -1, recvI = d.receive ? lastOf('them') : -1;
      const tTap = Math.max(1.1, span * 0.32);
      const cs = eio((local - tTap - 0.12) / 0.75);
      const tRecv = Math.max(1.3, span * 0.3);
      P.bubs.forEach((b, i) => {
        if (i === sendI) {
          // the photo waits in the composer as a thumbnail, then is sent up
          // into its place in the thread
          if (!b.dataset.dx) {
            const br = b.querySelector('.bb').getBoundingClientRect(), fr = P.fld.getBoundingClientRect();
            // measured on screen, applied inside the scaled handset
            b.dataset.dx = ((fr.right - 16 * PH_S - br.right) / PH_S).toFixed(1);
            b.dataset.dy = ((fr.top - 12 * PH_S - br.bottom) / PH_S).toFixed(1);
          }
          const bbq = b.querySelector('.bb');
          bbq.style.transformOrigin = '100% 100%';
          bbq.style.transform = `translate(${(+b.dataset.dx * (1 - cs)).toFixed(1)}px, ${(+b.dataset.dy * (1 - cs)).toFixed(1)}px) scale(${lerp(0.36, 1, cs).toFixed(4)})`;
          b.style.opacity = easeOut((local - 0.3) / 0.4).toFixed(3);
          const t1 = b.querySelector('.tm');
          if (t1) t1.style.opacity = (0.62 * clamp01((cs - 0.8) / 0.2)).toFixed(3);
          const k2 = b.querySelector('.tk2');
          if (k2) {
            const dl = d.delivered ? easeOut((local - tTap - 1.7) / 0.4) : 0;
            k2.style.opacity = dl.toFixed(3);
            b.querySelector('.tm svg').style.color = dl > 0.5 ? 'var(--accent)' : '';
          }
        } else if (i === recvI) {
          const a = easeOut((local - tRecv) / 0.6);
          b.style.opacity = a.toFixed(3);
          b.style.transform = `translateY(${((1 - a) * 26).toFixed(1)}px)`;
        } else {
          const a = B.carry ? 1 : easeOut((local - 0.35 - i * 0.16) / 0.5);
          b.style.opacity = a.toFixed(3);
          b.style.transform = `translateY(${((1 - a) * 14).toFixed(1)}px)`;
        }
      });
      if (P.snd) {
        const pr = clamp01((local - tTap) / 0.28);
        P.snd.style.transform = `scale(${(1 - 0.1 * Math.sin(pr * Math.PI)).toFixed(4)})`;
      }
      if (P.typing) {
        const on = clamp01((local - 0.4) / 0.3) * (1 - clamp01((local - tRecv + 0.1) / 0.2));
        P.typing.style.opacity = on.toFixed(3);
        P.typing.style.display = local > tRecv + 0.2 ? 'none' : '';
        P.dots.forEach((dt, j) => { dt.style.opacity = (0.35 + 0.65 * Math.max(0, Math.sin(tSec * 5 - j * 0.9))).toFixed(3); });
      }
    } else if (app === 'pay') {
      P.sheet.style.transform = `translateY(${(B.carry ? 0 : (1 - easeOut((local - 0.25) / 0.7)) * 460).toFixed(1)}px)`;
      const tap = Math.max(1.3, span * 0.35);
      const pr = clamp01((local - tap) / 0.28);
      P.btn.style.transform = `scale(${(1 - 0.04 * Math.sin(pr * Math.PI)).toFixed(4)})`;
      const busy = clamp01((local - tap - 0.1) / 0.2) * (1 - clamp01((local - tap - 1.1) / 0.2));
      P.lb.style.opacity = (1 - clamp01((local - tap - 0.05) / 0.2)).toFixed(3);
      P.ring.style.opacity = busy.toFixed(3);
      P.ring.style.transform = `rotate(${(local * 400).toFixed(1)}deg)`;
      if (d.success !== false) {
        const t0 = tap + 1.15;
        P.ok.style.opacity = easeOut((local - t0) / 0.35).toFixed(3);
        const lc = 314.2, lt = 70;
        P.oc.style.strokeDasharray = lc; P.oc.style.strokeDashoffset = (lc * (1 - easeInOut(clamp01((local - t0) / 0.6)))).toFixed(1);
        P.ot.style.strokeDasharray = lt; P.ot.style.strokeDashoffset = (lt * (1 - easeInOut(clamp01((local - t0 - 0.45) / 0.35)))).toFixed(1);
      }
    } else if (app === 'notify') {
      const a = B.carry ? 1 : easeOut((local - 0.5) / 0.6);
      P.ban.style.opacity = a.toFixed(3);
      P.ban.style.transform = `translateY(${((1 - a) * -44).toFixed(1)}px)`;
    } else {
      const goal = d.progress != null ? d.progress : 1;
      const t1 = Math.max(1.8, span * 0.7);
      const pr = local < 0.3 ? 0 : local < t1 * 0.5 ? 0.12 + 0.5 * easeOut((local - 0.3) / (t1 * 0.5 - 0.3))
        : 0.62 + (goal - 0.62) * easeInOut(clamp01((local - t1 * 0.5) / (t1 * 0.5)));
      P.prog.style.width = (pr * 100).toFixed(2) + '%';
      P.prog.parentNode.style.opacity = (pr >= 0.999 ? 1 - clamp01((local - t1) / 0.4) : 1).toFixed(3);
      P.blks.forEach((b, j) => { b.style.opacity = easeOut((pr - (0.25 + j * 0.13)) / 0.15).toFixed(3); });
    }
  }

  /* ---- flow on the floor ---- */
  function animFlow3d(B, sc, local, span, tSec) {
    const d = sc.data || {};
    if (!B.f3) {
      const all = B.wrap.querySelector('.f3all');
      const nodes = [...B.wrap.querySelectorAll('.f3n')];
      const pts = nodes.map((n) => [parseFloat(n.style.left), parseFloat(n.style.top)]);
      const cum = [0];
      for (let i = 1; i < pts.length; i++) cum.push(cum[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]));
      B.f3 = { plane: B.wrap.querySelector('.f3plane'), all, len: all.getTotalLength(), cum, pts, nodes,
        cards: nodes.map((n) => n.querySelector('.f3card')), fglow: nodes.map((n) => n.querySelector('.f3fglow')),
        cores: [...B.wrap.querySelectorAll('.f3core')], glos: [...B.wrap.querySelectorAll('.f3glo')],
        pk: [...B.wrap.querySelectorAll('.f3pk')], pkh: [...B.wrap.querySelectorAll('.f3pkh')],
        edge: B.wrap.querySelector('.f3edge'), anchor: B.wrap.querySelector('.h-anchor'), slots: [...B.wrap.querySelectorAll('.h-slot')] };
      B.f3.cores.forEach((p) => { const l = p.getTotalLength(); p.dataset.len = l; p.style.strokeDasharray = l; });
    }
    const F = B.f3;
    const yaw = 1.8 * Math.sin(tSec * 0.21) * DRIFT;
    F.plane.style.transform = `rotateX(${F3_TILT}deg) rotateZ(${yaw.toFixed(3)}deg)`;
    const bb = `rotateZ(${(-yaw).toFixed(3)}deg) rotateX(${-F3_TILT}deg) translate(-50%, -100%)`;
    const flipAt = span * 0.5;
    const state = F.nodes.map((nd, i) => {
      const to = nd.dataset.becomes;
      const s0 = (d.nodes[i] && d.nodes[i].state) || 'ok';
      const cur = to && local >= flipAt ? to : s0;
      if (!nd.classList.contains('s-' + cur)) {
        nd.classList.remove('s-ok', 's-busy', 's-blocked', 's-dead');
        nd.classList.add('s-' + cur);
        nd.querySelector('.st').textContent = STATE_LABEL[cur] || '';
      }
      return cur;
    });
    F.cards.forEach((c, i) => {
      const q = easeOut((local - 0.15 - i * 0.16) / 0.6);
      c.style.opacity = q.toFixed(3);
      c.style.transform = `${bb} translateY(${(-26 + (1 - q) * 18).toFixed(1)}px)`;
      F.nodes[i].querySelector('.f3foot').style.opacity = q.toFixed(3);
    });
    if (F.edge) {
      F.edge.style.transform = `translate3d(${F.edge.dataset.x}px, ${F.edge.dataset.y}px, 0) ${bb}`;
      F.edge.style.opacity = easeOut((local - 0.9) / 0.5).toFixed(3);
    }
    F.cores.forEach((p, i) => {
      const q = easeInOut(clamp01((local - 0.5 - i * 0.3) / 0.6));
      p.style.strokeDashoffset = (p.dataset.len * (1 - q)).toFixed(1);
      const bad = state[i + 1] === 'blocked' || state[i + 1] === 'dead';
      p.style.stroke = bad && local >= flipAt ? 'var(--bad)' : '';
    });
    // which node is active: the one the hero is passing, or the one named
    let glowAt = null;
    if (sc.hero && F.anchor) {
      const prog = easeInOut(clamp01((local - 0.7) / Math.max(1.2, span * 0.72)));
      // the train stops short of the last card so it never sits on its label
      const L = (F.len - 90) * prog;
      const pt = (l) => F.all.getPointAtLength(Math.max(0, Math.min(F.len, l)));
      const at = pt(L);
      F.anchor.style.transform = `translate3d(${at.x.toFixed(1)}px, ${at.y.toFixed(1)}px, 0) ${bb}`;
      F.slots.forEach((s, j) => {
        const p2 = pt(L - j * 46);
        s.style.transform = `translate3d(${p2.x.toFixed(1)}px, ${p2.y.toFixed(1)}px, 0) ${bb}`;
      });
      glowAt = L;
      F.glos.forEach((g, i) => {
        const inside = L > F.cum[i] + 5 && L < F.cum[i + 1] - 5;
        g.style.opacity = (inside ? 0.28 : 0).toString();
      });
    }
    F.fglow.forEach((g, i) => {
      let on = 0;
      if (glowAt != null) on = clamp01(1 - Math.abs(glowAt - F.cum[i]) / 170);
      else if (d.active === i) on = easeOut((local - 0.8) / 0.6);
      g.style.opacity = on.toFixed(3);
    });
    // without a hero, requests stream along the wires as small lights
    const traffic = d.traffic || 'flowing';
    for (let i = 0; i < F.cores.length; i++) {
      const [a, b] = [F.pts[i], F.pts[i + 1]];
      const ready = local > 0.5 + i * 0.3 + 0.6;
      const bad = (state[i + 1] === 'blocked' || state[i + 1] === 'dead') && local >= flipAt;
      for (let j = 0; j < 3; j++) {
        const c = F.pk[i * 3 + j], h = F.pkh[i * 3 + j];
        let at = (((tSec * (traffic === 'slow' ? 0.22 : 0.5)) - i * 0.2 - j / 3) % 1 + 1) % 1;
        if (bad || traffic === 'blocked') at = 0.6 - j * 0.12;
        const op = sc.hero || !ready || traffic === 'none' ? 0 : bad ? 0.9 : Math.min(1, Math.sin(at * Math.PI) * 2.2);
        const x = lerp(a[0], b[0], at), y = lerp(a[1], b[1], at);
        c.setAttribute('cx', x.toFixed(1)); c.setAttribute('cy', y.toFixed(1)); c.setAttribute('opacity', op.toFixed(3));
        h.setAttribute('cx', x.toFixed(1)); h.setAttribute('cy', y.toFixed(1)); h.setAttribute('opacity', (op * 0.3).toFixed(3));
      }
    }
  }

  function animWorld(B, sc, local, span, tSec, w) {
    if (sc.type === 'stack3d') animStack(B, sc.data || {}, local, span, tSec, w);
    else if (sc.type === 'phone') animPhone(B, sc.data || {}, local, span, tSec);
    else if (sc.type === 'flow') animFlow3d(B, sc, local, span, tSec);
  }

  // continuity between consecutive world scenes of the same kind: the stack
  // stays and the camera moves; the phone stays and its screen changes
  let titleB = null;
  function linkWorld() {
    if (!WORLD) return;
    built.forEach((b, i) => {
      const sc = scenes[i], pv = scenes[i - 1];
      if (!pv || !sc.data || !pv.data) return;
      if (sc.type === 'stack3d' && pv.type === 'stack3d' && !sc.data.twin && !pv.data.twin && sc.loopTo == null &&
          (sc.data.key || 'stack') === (pv.data.key || 'stack')) {
        b.carry = true;
        b.s3from = { f: pv.data.active || 0, D: pv.data.zoom != null ? pv.data.zoom : 150 };
        b.s3prevAct = pv.data.active || 0;
        const old = b.wrap.querySelector('.s3t.old'), mine = built[i - 1].wrap.querySelector('.s3t.new');
        if (old && mine && b.s3prevAct !== (sc.data.active || 0)) old.innerHTML = mine.innerHTML;
      }
      if (sc.type === 'phone' && pv.type === 'phone' && (sc.data.device || 'a') === (pv.data.device || 'a') &&
          (sc.data.app || 'chat') === (pv.data.app || 'chat')) b.carry = true;
    });
    const bd = S.title && S.title.backdrop;
    if (bd && bd.type) {
      const wrap = document.querySelector('#title .tback');
      wrap.innerHTML = builderFor(bd.type)(bd.data || {}, bd);
      titleB = { wrap, sc: bd };
    } else {
      // no diorama behind the title: the mascot holds the cover, as it always has
      document.querySelector('#title .tmascot').style.display = 'block';
    }
  }

  const mascot = $('mascot');
  const tmascot = document.querySelector('#title .tmascot');

  /** The title card at time t. Also redrawn at t=0 by a closing loopTo scene. */
  function drawTitle(tSec) {
    // Instagram takes the grid cover from the FIRST frame, so the title card
    // has to be fully drawn at t=0. An entrance that fades up from nothing
    // renders frame 0 as a blank page and the post gets a dead thumbnail.
    // The animation therefore only settles the card, it never reveals it.
    const big = document.querySelector('#title .big');
    big.style.opacity = 1;
    // slow push-in, then a zoom-through into the first scene
    const out = clamp01((tSec - (titleUntil - 0.22)) / 0.22);
    big.style.transform = `scale(${(1 + 0.035 * (tSec / Math.max(1, titleUntil)) + 0.05 * out * out).toFixed(4)})`;
    $('title').style.opacity = (1 - out * out).toFixed(3);
    titleWords.forEach(({ el, at }, i) => {
      const q = i === 0 || WORLD ? 1 : easeInOut(clamp01((tSec - at) / 0.32));
      el.style.opacity = i === 0 ? 1 : clamp01(q * 1.6).toFixed(3);
      el.style.transform = `translateY(${((1 - q) * 14).toFixed(1)}px)`;
    });
    document.querySelector('#title .kick').style.opacity = 1;
    // the rule sits under the headline's real bottom edge, which depends on
    // how many lines the hook wrapped to
    const rule = document.querySelector('#title .rule');
    rule.style.top = Math.round(big.getBoundingClientRect().bottom + 46) + 'px';
    // the keyword sits under the rule and is fully drawn from frame 0
    document.querySelector('#title .kw').style.top = Math.round(big.getBoundingClientRect().bottom + 84) + 'px';
    rule.style.transform = 'none';
    const tb = Math.sin(tSec * Math.PI * 2 / 3.4);
    tmascot.style.transform = `translateX(-50%) translateY(${(tb * 3).toFixed(2)}px)`;
    if (titleB) animWorld(titleB, titleB.sc, 99, 5, tSec, null);
  }

  /*
   * One world frame after the scene is chosen: the loop ending, the scene's
   * own animation, a calm crossfade at cuts (no slide, no blur), and the hero.
   */
  function worldFrame(k, sc, B, local, span, tSec) {
    // loopTo: the closing scene eases its camera and the drift to rest, the
    // title fades back in over it, and at w=1 the page IS frame 0
    let w = null;
    if (sc.loopTo != null && titleB) w = easeInOut(clamp01((local - 0.3) / Math.min(2.6, span * 0.6)));
    DRIFT = w == null ? 1 : 1 - w;
    updateGround(tSec);
    animWorld(B, sc, local, span, tSec, w);

    const T = 0.5;
    const carried = B.morph.size > 0 || !!B.carry;
    const tin = carried ? 1 : easeOut(local / T);
    const prog = clamp01(local / span);
    const push = isFull(sc.type) ? '' : `scale(${(1 + 0.02 * prog).toFixed(4)})`;
    B.wrap.style.transform = carried ? push : `translateY(${((1 - tin) * 16).toFixed(1)}px) ${push}`;
    B.wrap.style.opacity = carried ? 1 : tin.toFixed(3);
    B.wrap.style.filter = '';
    if (outgoing) {
      const O = built[outgoing.k];
      const q = clamp01((tSec - outgoing.t0) / T);
      if (q >= 1 || carried) { O.wrap.style.display = 'none'; outgoing = null; }
      else {
        O.wrap.style.display = 'flex';
        O.wrap.style.opacity = (1 - q * q).toFixed(3);
        O.wrap.style.filter = '';
      }
    }
    updateHeroes(sc, B, local, span, tSec);

    // the phone wants the height, so its scenes run the headline alone
    $('subhead').style.visibility = sc.type === 'phone' ? 'hidden' : '';
    // the mascot stands on the floor where the scene leaves room for it
    const room = sc.mascot != null ? !!sc.mascot : !(sc.type === 'stack3d' || sc.type === 'flow');
    const mq = room ? easeOut((local - 0.2) / 0.6) : 0;
    mascot.style.opacity = (mq * (w == null ? 1 : 1 - w)).toFixed(3);
    mascot.style.display = mq > 0 ? 'block' : 'none';

    const tl = $('title');
    if (w == null) {
      $('head').style.opacity = '';
      $('bar').style.opacity = '';
      return;
    }
    // the header leaves first, then the title arrives, so the two never overlap
    $('head').style.opacity = (1 - clamp01(w / 0.45)).toFixed(3);
    $('bar').style.opacity = (1 - clamp01(w / 0.45)).toFixed(3);
    tl.style.display = w > 0 ? 'block' : 'none';
    if (w <= 0) return;
    drawTitle(0);
    const back = tl.querySelector('.tback');
    if (w >= 1) {
      // identical to the opening frame from here on
      back.style.display = '';
      tl.style.opacity = 1;
      $('stage').style.display = 'none';
    } else {
      back.style.display = 'none';
      tl.style.opacity = clamp01((w - 0.5) / 0.5).toFixed(3);
    }
  }

  let shown = -2;
  let outgoing = null;
  let headWords = [];
  const MMDEF = {
    frame(i) {
      const tSec = i / FPS;

      // ---- title card owns the opening seconds outright
      const inTitle = tSec < titleUntil;
      $('title').style.display = inTitle ? 'block' : 'none';
      if (!inTitle) $('title').style.opacity = 1;
      $('stage').style.display = inTitle ? 'none' : 'block';
      if (WORLD) { DRIFT = 1; updateGround(tSec); }
      if (inTitle) {
        drawTitle(tSec);
        return;
      }

      // ---- which scene is on screen
      let k = 0;
      while (k + 1 < TOTAL && tSec >= starts[k + 1]) k++;
      const sc = scenes[k];
      if (!sc) return;
      const local = tSec - starts[k];
      const span = Math.max(0.6, ends[k] - starts[k]);

      if (k !== shown) {
        // the old scene stays up for a beat so it can leave instead of vanishing
        if (outgoing && built[outgoing.k]) built[outgoing.k].wrap.style.display = 'none';
        outgoing = built[shown] ? { k: shown, t0: starts[k] } : null;
        if (built[shown] && !outgoing) built[shown].wrap.style.display = 'none';
        // 'flex', not 'block': an inline block here silently overrode the
        // centring rule on #hero > div, so every hero sat at the top
        built[k].wrap.style.display = 'flex';
        const h = sc.headline || '';
        $('headline').innerHTML = h.split(/\s+/).filter(Boolean).map((w) => `<span class="w">${esc(w)}</span>`).join(' ');
        headWords = [...$('headline').querySelectorAll('.w')];
        // one line wherever possible: a two-line headline pushes nothing, but
        // three lines would collide with the hero column
        $('headline').style.fontSize = h.length > 42 ? '58px' : h.length > 26 ? '66px' : '76px';
        $('subhead').textContent = sc.subhead || '';
        $('counter').textContent =
          String(k + 1).padStart(2, '0') + ' — ' + String(TOTAL).padStart(2, '0');
        shown = k;
        if (WORLD) heroCut();
      }

      // ---- header enters on every cut, so the cut reads as a cut
      $('headline').style.opacity = 1;
      $('headline').style.transform = '';
      headWords.forEach((w, i) => {
        const q = spring(clamp01((local - i * 0.045) / 0.38));
        w.style.opacity = clamp01(q * 1.4).toFixed(3);
        w.style.transform = `translateY(${((1 - q) * 26).toFixed(1)}px)`;
      });
      const subEl = $('subhead');
      const sp = spring(clamp01((local - 0.12) / 0.42));
      subEl.style.opacity = sp * 0.95;
      subEl.style.transform = `translateY(${(1 - sp) * 10}px)`;

      // ---- hero elements stagger in, so a five second scene still moves
      const els = built[k].els;
      // spread the stagger across the first 55% of the scene, capped so a long
      // scene does not leave the last row arriving after the narration moved on
      const step = Math.min(0.34, (span * 0.55) / Math.max(1, els.length));
      const B = built[k];
      els.forEach((el, n) => {
        const mv = B.morph.get(el);
        if (mv) {
          // carried over from the previous scene: fully present from the first
          // frame, gliding from where it was drawn a moment ago
          const m = spring(clamp01(local / 0.55));
          el.style.opacity = 1;
          el.style.transformOrigin = m < 1 ? '0 0' : '';
          const sc2 = mv.s + (1 - mv.s) * m;
          el.style.transform = `translate(${(mv.dx * (1 - m)).toFixed(2)}px, ${(mv.dy * (1 - m)).toFixed(2)}px) scale(${sc2.toFixed(4)})`;
          return;
        }
        const p = spring(clamp01((local - 0.18 - n * step) / 0.5));
        el.style.opacity = p;
        el.style.transform = `translateY(${(1 - p) * 20}px) scale(${0.985 + 0.015 * p})`;
      });

      // ---- the mascot breathes, nothing else: it is set dressing, not a performer
      {
        const bob = Math.sin(tSec * Math.PI * 2 / 3.4);
        const hop = 0;
        mascot.style.transform = `translateY(${(bob * 3 - hop).toFixed(2)}px) scaleY(${(1 + bob * 0.006).toFixed(4)})`;
      }

      // ---- check and cross marks draw themselves rather than popping in
      B.draws.forEach((d, n) => {
        const p = clamp01((local - 0.34 - n * step) / 0.42);
        d.style.strokeDashoffset = (1 - p) * 40;
      });

      // ---- flow wires draw, then carry a document along the live wire
      if (sc.type === 'flow' && !WORLD) {
        // a node's state can change halfway through, while the line is spoken
        const flipAt = span * 0.5;
        const stateNow = B.nodes.map((nd) => {
          if (!nd.dataset.s0) nd.dataset.s0 = ([...nd.classList].find((c) => c.startsWith('s-')) || 's-ok').slice(2);
          const to = nd.dataset.becomes;
          const cur = to && local >= flipAt ? to : nd.dataset.s0;
          if (!nd.classList.contains('s-' + cur)) {
            nd.classList.remove('s-ok', 's-busy', 's-blocked', 's-dead');
            nd.classList.add('s-' + cur);
            const lbl = nd.querySelector('.st b');
            if (lbl) lbl.textContent = STATE_LABEL[cur];
          }
          if (to) {
            const q = clamp01((local - flipAt) / 0.4);
            if (q > 0 && q < 1) nd.style.transform += ` scale(${(1 + 0.05 * Math.sin(q * Math.PI)).toFixed(4)})`;
          }
          nd.style.boxShadow = cur === 'blocked'
            ? `0 0 0 ${(4 + 5 * (0.5 + 0.5 * Math.sin(tSec * 5))).toFixed(1)}px rgba(185,28,28,.16), 0 14px 34px rgba(30,25,15,.055)`
            : '';
          return { cur, flipped: !!to };
        });

        const traffic = sc.data.traffic || (sc.data.packet === false ? 'none' : 'flowing');
        B.wires.forEach((w, n) => {
          const ready = 0.34 + n * step * 2;
          const p = clamp01((local - ready) / 0.45);
          const lit = w.querySelector('.lit');
          const pkts = [...w.querySelectorAll('.pkt')];
          const stop = w.querySelector('.stop');
          lit.style.height = (p * 100) + '%';
          lit.style.background = '';
          stop.style.opacity = 0;
          if (p < 1 || traffic === 'none') { pkts.forEach((x) => { x.style.opacity = 0; }); return; }
          // requests stop dead at a wire whose downstream node is blocked or
          // down, from the moment it becomes so
          const dn = stateNow[n + 1];
          const downBad = dn && (dn.cur === 'blocked' || dn.cur === 'dead');
          let blockedFrom = null;
          if (downBad) blockedFrom = dn.flipped ? Math.max(flipAt, ready + 0.45) : ready + 0.45;
          else if (traffic === 'blocked') blockedFrom = ready + 0.45;
          if (blockedFrom !== null && local >= blockedFrom) {
            // requests pile up in front of the blocked node: a visible queue
            const q = clamp01((local - blockedFrom) / 1.1);
            pkts.forEach((x, j) => {
              const qj = clamp01(q * 1.3 - j * 0.2);
              const at = (0.62 - j * 0.2) * (1 - Math.pow(1 - qj, 3));
              x.style.top = `calc(${(at * 100).toFixed(1)}% - 16px)`;
              x.style.marginLeft = `${-13 + (j - 1) * 5}px`;
              x.style.opacity = qj > 0 ? 1 : 0;
            });
            stop.style.opacity = clamp01((q - 0.8) / 0.2);
            if (q >= 1) lit.style.background = 'var(--bad)';
            return;
          }
          // otherwise a stream: three requests per wire, evenly spaced
          const speed = traffic === 'slow' ? 0.28 : 0.8;
          pkts.forEach((x, j) => {
            const at = (((tSec * speed) - n * 0.22 - j / 3) % 1 + 1) % 1;
            x.style.top = `calc(${(at * 100).toFixed(1)}% - 16px)`;
            x.style.marginLeft = '-13px';
            x.style.opacity = Math.min(1, Math.sin(at * Math.PI) * 2.2) * (traffic === 'slow' ? 0.7 : 1);
          });
        });
      }

      if (sc.type === 'chart') animateChart(B, sc.data, local, span, k, tSec);
      animateNew(B, sc, local, span, tSec);

      // ---- window lines type themselves, with a caret on the newest line
      if (sc.type === 'window') {
        B.lines.forEach((ln, n) => {
          const full = ln.dataset.tx || '';
          const at = 0.3 + n * Math.min(0.5, step * 1.6);
          const p = clamp01((local - at) / Math.max(0.25, full.length * 0.018));
          const shown = full.slice(0, Math.round(full.length * p));
          const tx = ln.querySelector('.tx');
          const typing = p > 0 && p < 1;
          if (tx.textContent !== shown) tx.textContent = shown;
          tx.insertAdjacentHTML;
          ln.style.opacity = p > 0 ? 1 : 0;
          const cur = ln.querySelector('.cur');
          if (typing && !cur) tx.insertAdjacentHTML('beforeend', '<i class="cur"></i>');
          else if (!typing && cur) cur.remove();
        });
      }

      // ---- the number counts up to itself
      if (sc.type === 'stat' && B.stat) {
        const parts = statParts(B.stat.dataset.v);
        const fromP = statParts(B.stat.dataset.from);
        if (parts) {
          // with a starting value the number travels while it is being talked
          // about ("climbs from 40 to 3,000"); without one it slams into place
          const dur = fromP ? Math.min(span * 0.6, 3.2) : 0.7;
          const p = clamp01((local - 0.2) / dur);
          const eased = fromP ? easeInOut(p) : 1 - Math.pow(1 - p, 3);
          const a0 = fromP ? fromP.n : 0;
          const n = Math.round(a0 + (parts.n - a0) * eased);
          B.stat.textContent = parts.pre + n.toLocaleString('en-US') + (p >= 1 ? parts.frac : '') + parts.post;
          B.land = 0.2 + dur;
        } else {
          B.land = 0.6;
        }
        const q = easeInOut(clamp01((local - B.land - 0.1) / 0.55));
        const rule = B.wrap.querySelector('.srule');
        if (rule) rule.style.width = (q * 140).toFixed(1) + 'px';
      }

      if (WORLD) worldFrame(k, sc, B, local, span, tSec);
      // ---- camera: every scene drifts and pushes in slowly, so nothing on
      // screen is ever a still frame; transitions ride on the same transform
      else {
        const T = 0.32;
        const kind = ['slide', 'rise', 'zoom'][k % 3];
        const carried = B.morph.size > 0;
        const tin = carried ? 1 : 1 - Math.pow(1 - clamp01(local / T), 3);
        const prog = clamp01(local / span);
        let tf = `translateY(${(-10 * prog).toFixed(2)}px) scale(${(1 + 0.045 * prog).toFixed(4)})`;
        if (!carried) {
          if (kind === 'slide') tf = `translateX(${((1 - tin) * 80).toFixed(1)}px) ` + tf;
          if (kind === 'rise') tf = `translateY(${((1 - tin) * 60).toFixed(1)}px) ` + tf;
          if (kind === 'zoom') tf = `scale(${(0.95 + 0.05 * tin).toFixed(4)}) ` + tf;
        }
        B.wrap.style.transform = tf;
        B.wrap.style.opacity = carried ? 1 : clamp01(tin * 1.6).toFixed(3);
        B.wrap.style.filter = !carried && tin < 1 ? `blur(${((1 - tin) * 3).toFixed(1)}px)` : '';

        if (outgoing) {
          const O = built[outgoing.k];
          const q = clamp01((tSec - outgoing.t0) / T);
          if (q >= 1 || carried) { O.wrap.style.display = 'none'; outgoing = null; }
          else {
            O.wrap.style.display = 'flex';
            const e = q * q;
            O.wrap.style.opacity = (1 - e).toFixed(3);
            O.wrap.style.filter = `blur(${(e * 3).toFixed(1)}px)`;
            O.wrap.style.transform = kind === 'slide' ? `translateX(${(-80 * e).toFixed(1)}px)`
              : kind === 'rise' ? `translateY(${(-50 * e).toFixed(1)}px)` : `scale(${(1 + 0.04 * e).toFixed(4)})`;
          }
        }

        // the glow drifts behind the action, a little faster on stat scenes
        const g = $('glow');
        const sp = sc.type === 'stat' || sc.type === 'chart' ? 1.6 : 1;
        g.style.transform = `translate(${(Math.sin(tSec * 0.45 * sp) * 70).toFixed(1)}px, ${(Math.cos(tSec * 0.33 * sp) * 50).toFixed(1)}px)`;
        $('grid').style.backgroundPosition = `${(tSec * 7).toFixed(1)}px ${(tSec * 11).toFixed(1)}px`;
      }

      // ---- progress
      $('barfill').style.width = (clamp01(tSec / (ends[TOTAL - 1] || 1)) * 100).toFixed(2) + '%';
    },
  };

  const faces = ['400 20px Inter', '600 20px Inter', '800 20px Inter',
    '400 20px "JetBrains Mono"', '500 20px "JetBrains Mono"', '700 20px "JetBrains Mono"'];
  Promise.all(faces.map((f) => document.fonts.load(f).catch(() => null)))
    .then(() => document.fonts.ready)
    .then(() => {
      built.forEach((b, i) => { b.zoom = fitScene(b.wrap, scenes[i].type); fitNumbers(b.wrap); });
      built.forEach((b) => { b.keys = measureKeys(b); });
      linkScenes();
      linkWorld();
      // world: the progress bar runs along the header's hairline
      if (WORLD) $('bar').style.top = ($('head').offsetTop + $('headrow').offsetHeight - 2) + 'px';
      window.MM_FIT = built.map((b) => +(+b.zoom).toFixed(2));
      window.MM_MORPHS = built.map((b) => b.morph.size);
      window.mmBoot(MMDEF);
    });
})();
</script>
