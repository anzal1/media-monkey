<!doctype html>
<meta charset="utf-8" />
<title>explainer scene</title>
<style>
  /* Vendored OFL faces, loaded by path, so a headless Chrome on a CI runner
     renders the same type this machine does. Before this, 'Inter' silently
     fell back to whatever generic sans the runner happened to have. */
  @font-face { font-family: Inter; font-weight: 400; src: url('../../assets/fonts/Inter-Regular.ttf') format('truetype'); }
  @font-face { font-family: Inter; font-weight: 600; src: url('../../assets/fonts/Inter-SemiBold.ttf') format('truetype'); }
  @font-face { font-family: Inter; font-weight: 800; src: url('../../assets/fonts/Inter-Bold.ttf') format('truetype'); }
  @font-face { font-family: 'JetBrains Mono'; font-weight: 400; src: url('../../assets/fonts/JetBrainsMono-Regular.ttf') format('truetype'); }
  @font-face { font-family: 'JetBrains Mono'; font-weight: 500; src: url('../../assets/fonts/JetBrainsMono-Medium.ttf') format('truetype'); }
  @font-face { font-family: 'JetBrains Mono'; font-weight: 700; src: url('../../assets/fonts/JetBrainsMono-Bold.ttf') format('truetype'); }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; }
  body {
    background: #f7f5f1;
    font-family: Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif;
    color: #171614;
    -webkit-font-smoothing: antialiased;
  }
  :root {
    --accent: #c2410c;
    --ink: #171614;
    --mute: #6f6a61;
    --hair: #ded9d0;
    --good: #15803d;
    --bad: #b91c1c;
  }
  /* Barely-there graph paper. Present in the reference account and it stops the
     ground reading as an empty PowerPoint slide. */
  #grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(to right, rgba(23,22,20,.035) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(23,22,20,.035) 1px, transparent 1px);
    background-size: 90px 90px;
  }
  .mono { font-family: 'JetBrains Mono', ui-monospace, Menlo, monospace; }
  /* a soft accent glow that drifts behind whatever is active: depth, not decor */
  #glow { position: absolute; width: 900px; height: 900px; border-radius: 50%; left: 90px; top: 440px;
    background: radial-gradient(closest-side, color-mix(in srgb, var(--accent) 13%, transparent), transparent 72%);
    pointer-events: none; will-change: transform; }
  #hero > div { will-change: transform, opacity, filter; }
  #headline .w { display: inline-block; will-change: transform, opacity; }
  #title .big .w { display: inline-block; opacity: 0; will-change: transform, opacity; }
  #title .big .w.key { color: var(--accent); }
  /* stat: the number settles, then a hairline draws under its label */
  .stat { position: relative; }
  .stat .srule { display: block; height: 3px; width: 0; margin-top: 18px; background: currentColor; border-radius: 2px; opacity: .85; }

  /* ---------- constant page chrome ---------- */
  #head { position: absolute; left: 70px; top: 300px; width: 940px; }
  #headrow {
    display: flex; align-items: baseline; justify-content: space-between;
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 21px; letter-spacing: .18em; text-transform: uppercase;
    font-weight: 500; color: #8a857c;
    padding-bottom: 16px; border-bottom: 2px solid var(--hair);
  }
  #headline {
    margin-top: 30px; font-size: 76px; line-height: 1.02; letter-spacing: -.03em;
    font-weight: 800; max-width: 940px; text-wrap: balance;
  }
  #subhead {
    margin-top: 20px; min-height: 30px;
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 23px; letter-spacing: .12em; text-transform: uppercase;
    color: var(--mute); font-weight: 400;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  /* The hero column clears the mascot on the left and the Reels action strip
     on the right, and stops above the burned-in caption band. */
  /* inset on the right: this band is where the Reels like/comment/share
     buttons are drawn over the video */
  #hero { position: absolute; left: 290px; top: 616px; width: 680px; height: 545px; }
  #hero > div { display: flex; flex-direction: column; justify-content: center; }
  #mascot { position: absolute; left: 22px; top: 928px; height: 270px; transform-origin: 50% 100%; }

  #foot {
    position: absolute; left: 70px; top: 1206px; width: 940px;
    display: flex; align-items: center; justify-content: space-between;
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 19px; letter-spacing: .20em; text-transform: uppercase;
    color: #a09a90;
  }
  #bar { position: absolute; left: 70px; top: 1246px; width: 940px; height: 3px; background: var(--hair); }
  #barfill { height: 100%; width: 0; background: var(--accent); }

  /* ---------- shared scene furniture ---------- */
  .panel {
    background: #fff; border: 2px solid #e6e1d8; border-radius: 20px;
    box-shadow: 0 14px 34px rgba(30,25,15,.055);
  }
  .pill {
    display: inline-block; padding: 7px 16px; border-radius: 999px;
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 20px; font-weight: 500; letter-spacing: .04em;
    background: color-mix(in srgb, var(--accent) 12%, #fff);
    color: var(--accent);
  }
  .el { opacity: 0; will-change: transform, opacity; }

  /* flow */
  .flow { display: flex; flex-direction: column; gap: 12px; align-items: stretch; }
  .fnode { display: flex; align-items: center; gap: 22px; padding: 20px 28px; }
  .fnode .ico { width: 54px; height: 54px; flex: 0 0 54px; }
  .fnode .lab { font-size: 34px; font-weight: 700; letter-spacing: -.01em; }
  .fnode .sub { font-size: 23px; color: var(--mute); margin-top: 4px; }
  .wire { position: relative; height: 44px; }
  .wire .line { position: absolute; left: 50%; top: 0; width: 3px; height: 100%; background: var(--hair); transform: translateX(-50%); }
  .wire .lit { position: absolute; left: 50%; top: 0; width: 3px; height: 0; background: var(--accent); transform: translateX(-50%); }
  /* a document travelling the wire, not an abstract dot: the reference uses a
     page glyph and it reads instantly as "the request" */
  .wire .pkt { position: absolute; left: 50%; width: 26px; height: 32px; margin-left: -13px; top: 0; opacity: 0; }
  .wire .pkt svg { display: block; width: 100%; height: 100%;
    filter: drop-shadow(0 4px 10px rgba(30,25,15,.16)); }
  .wire .lbl {
    position: absolute; left: calc(50% + 24px); top: 50%; transform: translateY(-50%);
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 19px; letter-spacing: .10em; text-transform: uppercase; color: var(--mute);
  }

  /* live node state: a status pill and border that can change mid-scene */
  .fnode .st {
    margin-left: auto; display: flex; align-items: center; gap: 8px;
    font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 18px; font-weight: 500;
    letter-spacing: .12em; text-transform: uppercase; padding: 7px 14px; border-radius: 999px;
  }
  .fnode .st i { width: 10px; height: 10px; border-radius: 50%; background: currentColor; display: block; }
  .fnode.s-ok .st      { color: var(--good); background: #e8f5ec; }
  .fnode.s-busy .st    { color: #b45309;     background: #fdf2e0; }
  .fnode.s-blocked .st { color: var(--bad);  background: #fdeaea; }
  .fnode.s-dead .st    { color: #8a857c;     background: #efece6; }
  .fnode.s-blocked { border-color: #f1b3b3; }
  .fnode.s-dead { filter: grayscale(1); }
  .fnode.s-dead .lab { text-decoration: line-through; text-decoration-thickness: 3px; }
  .wire .stop { position: absolute; left: 50%; top: 50%; width: 30px; height: 30px;
    margin: -15px 0 0 -15px; opacity: 0; color: var(--bad); }

  /* chart: line, bars, meter */
  .chart { width: 100%; }
  .chart .hd { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 22px;
    letter-spacing: .18em; color: var(--mute); margin-bottom: 14px; }
  .chart svg.line { width: 100%; height: 300px; display: block; overflow: visible; }
  .chart .ends { display: flex; justify-content: space-between; align-items: baseline; margin-top: 18px; }
  .chart .ends .a { font-size: 40px; font-weight: 700; color: var(--mute); letter-spacing: -.02em; }
  .chart .ends .b { font-size: 76px; font-weight: 800; letter-spacing: -.04em; line-height: 1; white-space: nowrap; }
  .bars { display: flex; align-items: flex-end; gap: 30px; height: 400px; }
  .bar { flex: 1; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; }
  .bar .val { font-size: 44px; font-weight: 800; letter-spacing: -.03em; margin-bottom: 12px; }
  .bar .fill { width: 100%; height: 0; border-radius: 14px 14px 4px 4px; background: #d8d2c7; }
  .bar.top .fill { background: var(--accent); }
  .bar .lab { margin-top: 16px; font-size: 25px; text-align: center; line-height: 1.2; }
  .meter .cells { display: grid; gap: 10px; }
  .meter .cell { height: 70px; border-radius: 10px; background: #e7e2d9; }
  .meter .read { margin-top: 30px; font-size: 104px; font-weight: 800; letter-spacing: -.045em; line-height: 1; }
  .meter .read small { font-size: 48px; color: var(--mute); font-weight: 700; }
  .meter .l { margin-top: 14px; font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 23px; letter-spacing: .18em; color: var(--mute); }

  /* sequence: actors and the messages between them */
  .seq svg { width: 100%; height: 520px; overflow: visible; display: block; }
  .seq .actor rect { fill: #fff; stroke: #e0dbd2; stroke-width: 2; }
  .seq .actor text { font: 700 26px Inter, sans-serif; fill: var(--ink); }
  .seq .life { stroke: #d8d2c7; stroke-width: 2; stroke-dasharray: 7 9; }
  .seq .msg { fill: none; stroke-width: 4; stroke-linecap: round; }
  .seq .lbl { font: 500 21px 'JetBrains Mono', monospace; letter-spacing: .04em; }

  /* cells: bits, bytes, array slots */
  .cellsw { display: flex; flex-direction: column; align-items: center; width: 100%; }
  .cells-row { display: flex; gap: 8px; justify-content: center; position: relative; padding-top: 70px; }
  .cell { position: relative; display: flex; flex-direction: column; align-items: center; }
  .cell .b { display: grid; place-items: center; border-radius: 10px; background: #fff; border: 2px solid #e0dbd2;
    font-family: 'JetBrains Mono', monospace; font-weight: 700; color: var(--ink); transform-style: preserve-3d; }
  .cell.hot .b { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, #fff); color: var(--accent); }
  .cell.changed .b { color: var(--accent); }
  .cell .i { margin-top: 10px; font: 400 17px 'JetBrains Mono', monospace; color: #a9a49a; }
  .cells-ptr { position: absolute; top: 20px; width: 0; height: 0; border-left: 14px solid transparent;
    border-right: 14px solid transparent; border-top: 22px solid var(--accent); margin-left: -14px; opacity: 0; }
  .cells-grp { position: absolute; top: 0; height: 52px; border: 3px solid var(--accent); border-bottom: none;
    border-radius: 10px 10px 0 0; opacity: 0; }
  .cells-grp span { position: absolute; left: 50%; top: -6px; transform: translate(-50%, -100%); white-space: nowrap;
    font: 500 20px 'JetBrains Mono', monospace; letter-spacing: .06em; color: var(--accent); }
  .cellsw .cl { margin-top: 34px; font: 500 22px 'JetBrains Mono', monospace; letter-spacing: .14em;
    text-transform: uppercase; color: var(--mute); }

  /* tree */
  .treew svg { width: 100%; height: 500px; display: block; overflow: visible; }
  .treew .edge { stroke: #d8d2c7; stroke-width: 4; }
  .treew .edge.on { stroke: var(--accent); }
  .treew .node circle { fill: #fff; stroke: #d8d2c7; stroke-width: 3; }
  .treew .node text { font: 700 26px 'JetBrains Mono', monospace; fill: var(--ink); text-anchor: middle; dominant-baseline: central; }
  .treew .node.on circle { fill: var(--accent); stroke: var(--accent); }
  .treew .node.on text { fill: #fff; }
  .treew .tl { font: 500 22px 'JetBrains Mono', monospace; letter-spacing: .14em; text-transform: uppercase; color: var(--mute); text-align: center; margin-top: 6px; }

  /* stack: layers on a log scale */
  .stackw { width: 100%; }
  .stackw .hd { font-size: 27px; font-weight: 700; margin-bottom: 24px; }
  .srow { display: grid; grid-template-columns: 150px 1fr; align-items: center; gap: 18px; margin-bottom: 22px; }
  .srow .lab { font-size: 25px; font-weight: 600; }
  .srow .track { position: relative; height: 52px; }
  .srow .bar { position: absolute; left: 0; top: 0; height: 100%; width: 0; border-radius: 8px; background: #d8d2c7; }
  .srow.top .bar { background: var(--accent); }
  .srow .val { position: absolute; top: 50%; transform: translateY(-50%); white-space: nowrap;
    font: 700 23px 'JetBrains Mono', monospace; color: var(--ink); opacity: 0; }

  /* code: syntax colour, spotlight, flagged line */
  .code .winbody { font-size: 23px; line-height: 1.8; }
  .code .ln { border-left: 4px solid transparent; padding-left: 10px; margin-left: -14px; border-radius: 4px; }
  .code .ln.focus { border-left-color: var(--accent); background: color-mix(in srgb, var(--accent) 8%, transparent); }
  .code .ln.badl { border-left-color: var(--bad); background: #fdeaea; }
  .code .ln.badl .tx { text-decoration: underline wavy var(--bad); text-decoration-thickness: 2px; text-underline-offset: 7px; }
  .tk-k { color: #7c3aed; font-weight: 700; } .tk-s { color: #15803d; } .tk-n { color: #c2410c; }
  .tk-c { color: #a9a49a; font-style: italic; } .tk-f { color: #2563eb; }

  /* compare */
  .cmp { display: flex; flex-direction: column; }
  .cmptop { display: flex; align-items: center; justify-content: space-between; gap: 18px; }
  .cmpside { flex: 1; text-align: center; }
  .cmpside .ico { width: 90px; height: 90px; margin: 0 auto 16px; }
  .cmpside .lab { font-size: 30px; font-weight: 700; }
  .cmpside .sub { font-size: 21px; color: var(--mute); margin-top: 6px; }
  .vs { font-family: 'JetBrains Mono', monospace; font-size: 26px; font-weight: 700; color: #b5afa4; letter-spacing: .1em; }
  .cmprow { display: flex; gap: 18px; margin-top: 26px; padding-top: 20px; border-top: 2px solid var(--hair); }
  .cmprow div { flex: 1; font-size: 24px; text-align: center; color: var(--ink); }

  /* window */
  .win { overflow: hidden; border-radius: 16px; border: 2px solid #e0dbd2; background: #fff; box-shadow: 0 18px 44px rgba(30,25,15,.09); }
  .wintitle {
    display: flex; align-items: center; gap: 14px; padding: 16px 20px;
    background: #efece6; border-bottom: 1px solid #e0dbd2;
    font-size: 21px; color: #6b665e;
  }
  .lights { display: flex; gap: 8px; }
  .lights i { width: 14px; height: 14px; border-radius: 50%; display: block; }
  .winbody { padding: 22px 24px; font-family: 'JetBrains Mono', monospace; font-size: 22px; line-height: 1.75; }
  .winbody .ln { display: flex; gap: 20px; white-space: pre; }
  .winbody .cur {
    display: inline-block; width: 12px; height: 26px; vertical-align: -5px;
    background: var(--accent); margin-left: 2px;
  }
  .winbody .no { color: #b9b3a8; width: 28px; text-align: right; flex: 0 0 28px; }
  .winbody .tx { color: #3c3a36; }
  .winbody .good .tx { color: var(--good); }
  .winbody .bad  .tx { color: var(--bad); }
  .winbody .dim  .tx { color: #a9a49a; }
  .winstatus {
    display: flex; justify-content: space-between; padding: 12px 20px;
    border-top: 1px solid #e8e4dc; background: #faf8f5;
    font-family: 'JetBrains Mono', monospace; font-size: 19px; color: #7c766c;
  }

  /* card */
  .card1 { padding: 34px 36px; }
  .card1 .top { display: flex; align-items: center; justify-content: space-between; gap: 20px; }
  .card1 .ico { width: 60px; height: 60px; }
  .card1 .title { margin-top: 22px; font-family: 'JetBrains Mono', monospace; font-size: 38px; font-weight: 700; word-break: break-all; }
  .card1 .sub { margin-top: 14px; font-size: 24px; color: var(--mute); }

  /* list */
  .lst .hd { font-size: 27px; font-weight: 700; margin-bottom: 20px; }
  .lrow { display: flex; align-items: center; gap: 20px; padding: 22px 4px; border-bottom: 2px solid var(--hair); }
  .lrow .ico { width: 34px; height: 34px; flex: 0 0 34px; }
  .lrow .draw { stroke-dasharray: 40; stroke-dashoffset: 40; }
  .lrow .lab { font-size: 29px; }

  /* stat */
  .stat { display: flex; flex-direction: column; justify-content: center; height: 100%; }
  .stat .v { font-size: 150px; font-weight: 800; letter-spacing: -.05em; line-height: .95; white-space: nowrap; align-self: flex-start; }
  .stat .l { margin-top: 20px; font-family: 'JetBrains Mono', monospace; font-size: 24px; letter-spacing: .20em; color: var(--mute); }

  /* diff */
  .diff .hd { font-family: 'JetBrains Mono', monospace; font-size: 26px; font-weight: 700; padding: 22px 26px 16px; }
  .drow { font-family: 'JetBrains Mono', monospace; font-size: 22px; padding: 10px 26px; white-space: pre; color: #3c3a36; }
  .drow.add { background: #e9f6ec; color: #14532d; }
  .drow.del { background: #fdecec; color: #7f1d1d; }

  /* note */
  .note .lead { font-size: 46px; font-weight: 700; line-height: 1.15; letter-spacing: -.02em; }
  .note .body { margin-top: 26px; font-size: 30px; line-height: 1.45; color: var(--mute); }

  /* title card: its own layout, no chrome */
  #title { position: absolute; inset: 0; display: none; }
  #title .kick {
    position: absolute; left: 70px; top: 330px;
    font-family: 'JetBrains Mono', monospace; font-size: 24px;
    letter-spacing: .28em; text-transform: uppercase; color: #8a857c;
  }
  #title .big {
    position: absolute; left: 70px; top: 520px; width: 940px;
    font-size: 104px; font-weight: 800; line-height: 1.0; letter-spacing: -.035em;
    text-align: center; text-wrap: balance;
  }
  /* The title card is frame 0, which makes it the profile-grid cover. The
     dashed placeholder boxes borrowed from the reference read as broken empty
     UI at thumbnail size, so the cover is headline, accent rule and mascot. */
  #title .rule { position: absolute; left: 480px; width: 120px; height: 10px;
    border-radius: 5px; background: var(--accent); }
  #title .kw { position: absolute; left: 70px; width: 940px; text-align: center;
    font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 30px; font-weight: 500;
    letter-spacing: .14em; text-transform: uppercase; color: var(--accent); }
  #title .tmascot { position: absolute; left: 50%; transform: translateX(-50%);
    top: 1010px; height: 360px; }

  /* ================= diorama theme (spec "theme": "diorama") =================
     A prototype behind a flag: none of these rules match without the class on
     <html>, so the flat theme renders exactly as before. Daylight tabletop:
     the same warm paper ground, a printed grid receding in perspective, matte
     slabs with ink outlines and soft contact shadows. Focus is lift and
     shadow, never glow. Motion is settle and glide only. */
  html.diorama #grid, html.diorama #glow, html.diorama #foot,
  html.diorama #title .tmascot { display: none; }
  #wsky { position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(to bottom, #f7f5f1 0%, #f5f2ec 36%, #efebe3 100%); }
  /* the floor's vanishing point is the perspective origin, so the horizon
     sits at y=700 whatever the plane's size */
  #wfloor { position: absolute; inset: 0; overflow: hidden; pointer-events: none;
    perspective: 700px; perspective-origin: 540px 700px; }
  #wplane { position: absolute; left: -2460px; top: -3100px; width: 6000px; height: 5200px;
    transform-origin: 50% 100%; transform: rotateX(80deg);
    background-image:
      linear-gradient(to right, rgba(23,22,20,.085) 2px, transparent 2px),
      linear-gradient(to bottom, rgba(23,22,20,.085) 2px, transparent 2px);
    background-size: 140px 140px;
    -webkit-mask-image: linear-gradient(to top, #000 0%, #000 30%, transparent 88%);
    mask-image: linear-gradient(to top, #000 0%, #000 30%, transparent 88%); }
  #wvig { position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(120% 80% at 50% 48%, transparent 60%, rgba(120,100,70,.10) 100%); }
  #wstage, #hobjs { position: absolute; inset: 0; pointer-events: none; }
  #hobjs { z-index: 4; }
  html.diorama #head { z-index: 5; }
  html.diorama #headrow { border-bottom-color: transparent; }
  /* the header hairline doubles as the progress track */
  html.diorama #bar { height: 2px; z-index: 5; }
  html.diorama #hero { left: 80px; top: 600px; width: 880px; height: 680px; }
  html.diorama #title .kick { top: 330px; }
  html.diorama #title .big { top: 410px; font-size: 96px; }
  html.diorama #title .big, html.diorama #title .kick, html.diorama #title .rule, html.diorama #title .kw { z-index: 2; }
  #title .tback { position: absolute; inset: 0; }
  html.diorama .stat { align-items: center; text-align: center; }
  html.diorama .stat .v { align-self: center; font-size: 230px; }
  html.diorama .stat .srule { margin-left: auto; margin-right: auto; }
  /* the mascot stands on the floor, small, with a contact shadow */
  html.diorama #mascot { left: 34px; top: 1118px; height: 196px; z-index: 3;
    filter: drop-shadow(0 16px 12px rgba(60,45,25,.22)); }

  /* ---- stack3d: matte slabs on the table ---- */
  .s3wrap { position: absolute; inset: 0; }
  .s3 { position: absolute; inset: 0; perspective: 1700px; perspective-origin: 540px 1070px;
    -webkit-mask-image: linear-gradient(to bottom, transparent 430px, #000 600px, #000 1300px, transparent 1470px);
    mask-image: linear-gradient(to bottom, transparent 430px, #000 600px, #000 1300px, transparent 1470px); }
  .s3wrap.twin .s3 { -webkit-mask-image: none; mask-image: none; }
  .s3rig { position: absolute; left: 540px; top: 1070px; width: 0; height: 0; transform-style: preserve-3d; }
  .s3wrap.twin .s3rig[data-side="l"] { left: 285px; top: 1075px; }
  .s3wrap.twin .s3rig[data-side="r"] { left: 795px; top: 1075px; }
  .s3plate { position: absolute; transform-style: preserve-3d; }
  .s3face, .s3side, .s3shad { position: absolute; inset: 0; border-radius: 24px; }
  /* thickness: a few layers under the face read as a solid side edge */

<script>
(function () {
  const S = window.SPEC;
  const FPS = 30;
  window.FPS = FPS;

  document.documentElement.style.setProperty('--accent', S.accent || '#c2410c');

  const scenes = S.scenes || [];
  const TOTAL = scenes.length;
  // Scene boundaries come from the real TTS durations. Opening the page by hand
  // with no spec falls back to equal slices so it is still eyeball-able.
  const SECONDS = Number((/[?&]seconds=(\d+)/.exec(location.search) || [])[1] || 120);
  const starts = Array.isArray(S.starts) && S.starts.length === TOTAL
    ? S.starts
    : scenes.map((_, i) => (i * SECONDS) / TOTAL);
  const ends = starts.map((s, i) => (i + 1 < TOTAL ? starts[i + 1] : s + 5));
  const titleUntil = Number(S.titleUntil || 0);

  const $ = (id) => document.getElementById(id);

  // World theme: a flag on the spec. Absent, nothing below the guard runs and
  // the page is the light theme it always was.
  const WORLD = S.theme === 'diorama';
  let DRIFT = 1;          // camera drift amplitude; the loop ending eases it to 0
  if (WORLD) {
    const root = document.documentElement;
    root.classList.add('diorama');
    document.body.insertAdjacentHTML('afterbegin',
      '<div id="wsky"></div><div id="wfloor"><div id="wplane"></div></div><div id="wvig"></div>');
    $('stage').insertAdjacentHTML('afterbegin', '<div id="wstage"></div>');
    $('hero').insertAdjacentHTML('afterend', '<div id="hobjs"></div>');
    $('title').insertAdjacentHTML('afterbegin', '<div class="tback"></div>');
    // a closing scene with loopTo and no content of its own reuses the title
    // backdrop, and a title with no backdrop borrows the closing scene's
    const scs = S.scenes || [];
    const loop = scs.find((s) => s.loopTo != null);
    if (S.title && loop) {
      if (!S.title.backdrop && loop.type) S.title.backdrop = { type: loop.type, data: loop.data };
      if (!loop.type && S.title.backdrop) { loop.type = S.title.backdrop.type; loop.data = S.title.backdrop.data; }
    }
    // stack3d scenes may omit plates and inherit them from the previous stack
    const plates = {};
    for (const s of scs) {
      if (s.type !== 'stack3d' || !s.data) continue;
      const key = s.data.key || 'stack';
      if (!s.data.plates && plates[key]) s.data.plates = plates[key];
      if (s.data.plates) plates[key] = s.data.plates;
    }
    const bd = S.title && S.title.backdrop;
    if (bd && bd.type === 'stack3d' && bd.data && !bd.data.plates) bd.data.plates = plates[bd.data.key || 'stack'] || [];
  }
  /** World ground: a slow sway of the floor, zero at t=0 so a loop can land on frame 0. */
  function updateGround(t) {
    if (!WORLD) return;
    const a = DRIFT;
    $('wplane').style.backgroundPosition =
      `${(46 * Math.sin(t * 0.13) * a).toFixed(2)}px ${(90 * Math.sin(t * 0.09) * a).toFixed(2)}px`;
    $('wfloor').style.perspectiveOrigin = `${(540 + 34 * Math.sin(t * 0.17) * a).toFixed(2)}px 700px`;
  }

  $('eyebrow').textContent = S.eyebrow || '';
  $('episode').textContent = S.episode || '';
  $('handle').textContent = S.handle || '';
  // The hook lands word by word, timed to the narration: proportional to word
  // length across the first 80% of the spoken hook. The first word is up on
  // frame 0, and the whole hook is up by the cover frame render.mjs chooses.
  let titleWords = [];
  if (S.title) {
    document.querySelector('#title .kick').textContent = S.title.kicker || '';
    document.querySelector('#title .kw').textContent = S.title.keyword || '';
    const big = document.querySelector('#title .big');
    // a bracketed group like "abs(INT MIN)" is one unit: never break inside it
    const words = [];
    for (const w of String(S.title.title || '').split(/\s+/).filter(Boolean)) {
      const last = words[words.length - 1];
      const openParen = last && (last.match(/\(/g) || []).length > (last.match(/\)/g) || []).length;
      // two all-caps tokens in a row are one name: INT MIN, TLS 1.3, P99 SLO
      const capsPair = last && /^[A-Z0-9_]{2,}$/.test(last.split('\u00a0').pop()) && /^[A-Z0-9_]{2,}[.,!?]?$/.test(w);
      if (openParen || capsPair) words[words.length - 1] = last + '\u00a0' + w;
      else words.push(w);

    const key = words.findIndex((w) => /\d/.test(w)) >= 0 ? words.findIndex((w) => /\d/.test(w))
      : words.reduce((b, w, i) => (w.replace(/\W/g, '').length > words[b].replace(/\W/g, '').length ? i : b), 0);
    big.innerHTML = words.map((w, i) => `<span class="w${i === key ? ' key' : ''}">${esc(w)}</span>`).join(' ');
    const weights = words.map((w) => w.length + 2);
    const tot = weights.reduce((a, b) => a + b, 0) || 1;
    let acc = 0;
    titleWords = [...big.querySelectorAll('.w')].map((el, i) => {
      const at = (acc / tot) * Math.max(0.6, titleUntil * 0.8);
      acc += weights[i];
      return { el, at };
    });
  }

  // ---------- icons ----------
  // ICONS is assets/icons/icons.json, injected next to the spec. Brand marks
  // are a single filled path in the official brand colour; concepts are lucide
  // outlines that inherit the reel's accent.
  const ICONS = window.ICONS || {};
  const STROKE = '<style>.lc *{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}</style>';
  function icon(kind, colour) {
    const ic = ICONS[kind] || ICONS.box;
    if (!ic) return '';
    if (ic.kind === 'brand') {
      return `<svg viewBox="0 0 24 24" style="width:100%;height:100%">` +
        `<path d="${ic.d}" fill="${ic.hex || colour || 'var(--accent)'}"/></svg>`;
    }
    return `<svg class="lc" viewBox="0 0 24 24" style="width:100%;height:100%;color:${colour || 'var(--accent)'}">${STROKE}${ic.svg}</svg>`;
  }
  const mark = (d, colour) =>
    `<svg viewBox="0 0 24 24" style="width:100%;height:100%;color:${colour}">` +
    `<path d="${d}" fill="none" stroke="currentColor" stroke-width="2.4" ` +
    `stroke-linecap="round" stroke-linejoin="round" class="draw"/></svg>`;
  // the thing travelling the wire is a document, not an abstract dot
  const PACKET =
    '<svg viewBox="0 0 24 30"><path d="M2 2h12l8 8v18H2z" fill="#fff" ' +
    'stroke="var(--accent)" stroke-width="2.4" stroke-linejoin="round"/>' +
    '<path d="M14 2v8h8" fill="none" stroke="var(--accent)" stroke-width="2.4" ' +
    'stroke-linejoin="round"/><path d="M6 16h11M6 21h8" stroke="var(--accent)" ' +
    'stroke-width="2" stroke-linecap="round" opacity=".55"/></svg>';
  const CHECK = 'M20 6L9 17l-5-5';

  const STATE_LABEL = { ok: 'OK', busy: 'BUSY', blocked: 'BLOCKED', dead: 'DOWN' };
  // keys decide which element in the next scene IS this one, so they ignore
  // case and punctuation: "Postgres" and "postgres." are the same box
  const keyOf = (t) => String(t || '').toLowerCase().replace(/[^a-z0-9]+/g, '');
  const fmtNum = (n) => Number(n).toLocaleString('en-US', { maximumFractionDigits: 1 });

  function esc(s) { return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

  // ---------- world: hero artwork ----------
  // The hero is drawn, not photographed: no stock image and nothing that
  // could be someone's real photo, card or document.
  const HW = 320, HH = 240;
  const HERO_SVG = {

      `<rect width='320' height='240' fill='url(#s)'/><rect width='320' height='240' fill='url(#g)'/>` +
      `<circle cx='212' cy='150' r='26' fill='#fff1d6'/>` +
      `<path d='M0 168 C40 140 80 146 118 160 C160 176 200 150 244 152 C276 154 300 162 320 158 V240 H0Z' fill='#4a3150'/>` +
      `<path d='M0 192 C60 172 120 186 170 194 C220 202 270 182 320 186 V240 H0Z' fill='#271d34'/>` +
      `<path d='M0 214 C90 204 180 216 320 208 V240 H0Z' fill='#151221'/>` +
      `<path d='M60 196 l6 -16 l6 16 Z M66 182 v-6' stroke='#151221' stroke-width='2' fill='#151221'/></svg>`,
    card: () => `<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 320 240'><defs><linearGradient id='c' x1='0' y1='0' x2='1' y2='1'>` +

      `<rect width='320' height='240' fill='url(#c)'/><rect x='28' y='70' width='50' height='38' rx='7' fill='#c9a86a'/>` +
      `<text x='28' y='164' font-family='monospace' font-size='24' fill='#e8e6e1' letter-spacing='3'>•••• •••• 0042</text>` +
      `<text x='28' y='204' font-family='monospace' font-size='15' fill='#8a9099' letter-spacing='2'>VALID 09/29</text></svg>`,
    file: (h) => `<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 320 240'><rect width='320' height='240' fill='#e9e7e2'/>` +
      `<rect x='30' y='30' width='260' height='20' rx='4' fill='#c8c4bc'/>` +
      [70, 98, 126, 154, 182].map((y, i) => `<rect x='30' y='${y}' width='${i % 2 ? 200 : 250}' height='12' rx='6' fill='#d6d2ca'/>`).join('') +
      `<text x='290' y='222' text-anchor='end' font-family='monospace' font-size='18' fill='#6f6a61'>${esc((h.ext || 'PDF').toUpperCase())}</text></svg>`,
    packet: () => `<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 320 240'><rect width='320' height='240' fill='#15181f'/>` +
      `<rect width='320' height='48' fill='#252a35'/>` +
      [80, 110, 140, 170, 200].map((y, i) => `<rect x='24' y='${y}' width='${[270, 230, 260, 190, 240][i]}' height='12' rx='6' fill='#2f3542'/>`).join('') + `</svg>`,
    message: (h) => `<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 320 240'><rect width='320' height='240' fill='#1d2027'/>` +
      `<text x='26' y='80' font-family='sans-serif' font-size='30' fill='#ecebe7'>${esc(h.text || 'hey, look')}</text>` +
      `<rect x='26' y='120' width='230' height='14' rx='7' fill='#30343c'/><rect x='26' y='150' width='170' height='14' rx='7' fill='#30343c'/></svg>`,
  };
  const heroArt = (h) => `url("data:image/svg+xml;utf8,${encodeURIComponent((HERO_SVG[h && h.kind] || HERO_SVG.photo)(h || {}))}")`;
  const heroGrid = (h) => {
    const n = Math.max(1, Math.min(12, (h && h.n) || 6));
    const cols = n <= 3 ? n : Math.ceil(n / 2);
    return { n, cols, rows: Math.ceil(n / cols), tw: HW / cols, th: HH / Math.ceil(n / cols) };
  };
  const SVG_TICK = '<svg viewBox="0 0 22 12"><path d="M1 6.5l3.5 3.5L11 2.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>' +
    '<path class="tk2" d="M8.5 9.5l.5.5L16.5 2.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  const SVG_SB = '<svg viewBox="0 0 18 12"><rect x="0" y="8" width="3" height="4" rx="1" fill="currentColor"/><rect x="5" y="5.5" width="3" height="6.5" rx="1" fill="currentColor"/>' +
    '<rect x="10" y="3" width="3" height="9" rx="1" fill="currentColor"/><rect x="15" y="0" width="3" height="12" rx="1" fill="currentColor"/></svg>' +
    '<svg viewBox="0 0 16 12"><path d="M8 11.2l2.2-2.6a3.2 3.2 0 0 0-4.4 0zM3.6 6.4a6.4 6.4 0 0 1 8.8 0l1.5-1.8a8.8 8.8 0 0 0-11.8 0zM.6 3a10.8 10.8 0 0 1 14.8 0" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>' +
    '<svg viewBox="0 0 26 12"><rect x=".7" y=".7" width="21.6" height="10.6" rx="3" fill="none" stroke="currentColor" stroke-opacity=".5" stroke-width="1.3"/>' +
    '<rect x="2.5" y="2.5" width="15" height="7" rx="1.6" fill="currentColor"/><rect x="23.4" y="4" width="1.8" height="4" rx=".9" fill="currentColor" fill-opacity=".5"/></svg>';

  /** flow on the floor: node positions on a 1000x1000 plane, zigzagging into depth */
  function f3Layout(n) {
    if (n <= 1) return [[500, 520]];
    if (n === 2) return [[250, 560], [750, 460]];
    return Array.from({ length: n }, (_, i) => [200 + (600 * i) / (n - 1), i % 2 ? 300 : 690]);
  }
  const F3_TILT = 60;

  function flow3d(d, sc) {
    const nodes = d.nodes || [];
    const pts = f3Layout(nodes.length);
    let svg = '<svg class="f3svg" viewBox="0 0 1000 1000">';
    for (let i = 1; i < pts.length; i++) {
      const [a, b] = [pts[i - 1], pts[i]];
      const dd = `M${a[0]},${a[1]} L${b[0]},${b[1]}`;
      svg += `<path class="f3base" d="${dd}"/><path class="f3glo" d="${dd}"/><path class="f3core" d="${dd}"/>`;
      for (let j = 0; j < 3; j++) svg += '<circle class="f3pkh" r="20" opacity="0"/><circle class="f3pk" r="8" opacity="0"/>';
    }
    svg += `<path class="f3all" d="M${pts.map((p) => p.join(',')).join(' L')}" stroke="none"/></svg>`;
    const cards = nodes.map((nd, i) => {
      const st = nd.state || 'ok';
      return `<div class="f3n s-${st}" data-i="${i}"${nd.becomes ? ` data-becomes="${nd.becomes}"` : ''} style="left:${pts[i][0]}px;top:${pts[i][1]}px">` +
        `<div class="f3foot"><div class="f3fglow"></div></div>` +
        `<div class="f3card f3bb"><span class="ico">${icon(nd.kind)}</span><b>${esc(nd.label)}</b>` +
        (nd.sub ? `<small>${esc(nd.sub)}</small>` : '') + `<span class="st">${STATE_LABEL[st] || ''}</span></div></div>`;
    }).join('');
    const mid = pts.length > 1 ? [(pts[0][0] + pts[1][0]) / 2, (pts[0][1] + pts[1][1]) / 2] : pts[0];
    const edge = d.edge ? `<div class="f3edge f3bb" data-x="${mid[0] + 40}" data-y="${mid[1] + 150}">${esc(d.edge)}</div>` : '';
    let hero = '';
    if (sc && sc.hero) {
      const g = heroGrid(sc.hero);
      const k = 230 / HW;
      hero = `<div class="h-anchor f3bb" data-meta="0" data-tags="0" style="width:230px;height:${HH * k}px"></div>` +
        Array.from({ length: g.n }, () => `<div class="h-slot f3bb" style="width:${g.tw * k * 0.5}px;height:${g.th * k * 0.5}px"></div>`).join('');
    }
    return `<div class="f3"><div class="f3plane">${svg}${cards}${edge}${hero}</div></div>`;
  }

  // ---------- scene builders ----------
  // Each returns HTML for #hero. Every animatable element carries class "el";
  // the frame loop staggers them in, so builders never think about time.
  const BUILD = {
    flow(d) {
      const parts = [];
      d.nodes.forEach((n, i) => {
        if (i) {
          parts.push(
            `<div class="wire el"><span class="line"></span><span class="lit"></span>` +
            `<span class="pkt">${PACKET}</span><span class="pkt">${PACKET}</span><span class="pkt">${PACKET}</span>` +
            `<span class="stop">${mark(CROSS, 'var(--bad)')}</span>` +
            (i === 1 && d.edge ? `<span class="lbl">${esc(d.edge)}</span>` : '') +
            `</div>`);
        }
        const state = n.state || 'ok';
        // the pill only appears when state is part of the story; an OK badge on
        // every node would be noise
        const pill = (state !== 'ok' || n.becomes)
          ? `<span class="st"><i></i><b>${STATE_LABEL[state]}</b></span>` : '';
        parts.push(
          `<div class="fnode panel el s-${state}" data-key="${keyOf(n.label)}"` +
          (n.becomes ? ` data-becomes="${n.becomes}"` : '') + `>` +
          `<span class="ico">${icon(n.kind)}</span>` +
          `<span><span class="lab">${esc(n.label)}</span>` +
          (n.sub ? `<div class="sub">${esc(n.sub)}</div>` : '') + `</span>${pill}</div>`);
      });
      return `<div class="flow">${parts.join('')}</div>`;
    },
    compare(d) {
      const side = (s) => `<div class="cmpside el" data-key="${keyOf(s.label)}"><div class="ico">${icon(s.kind)}</div>` +
        `<div class="lab">${esc(s.label)}</div>` +
        (s.sub ? `<div class="sub">${esc(s.sub)}</div>` : '') + `</div>`;
      const rows = (d.rows || []).map((r) =>
        `<div class="cmprow el"><div>${esc(r.left)}</div><div>${esc(r.right)}</div></div>`).join('');
      return `<div class="cmp"><div class="cmptop">${side(d.left)}<span class="vs el">VS</span>${side(d.right)}</div>${rows}</div>`;
    },
    window(d) {
      const lines = d.lines.map((l, i) =>
        `<div class="ln el ${l.tone}" data-tx="${esc(l.text)}"><span class="no">${i + 1}</span>` +
        `<span class="tx">${esc(l.text)}</span></div>`).join('');
      return `<div class="win el" data-key="${keyOf((d.file || '') + ' ' + (d.app || ''))}">` +
        `<div class="wintitle"><span class="lights"><i style="background:#f05b4f"></i><i style="background:#f9bd2e"></i><i style="background:#57c354"></i></span>` +
        `<span>${esc(d.file || '')}${d.file && d.app ? ' - ' : ''}${esc(d.app || '')}</span></div>` +
        `<div class="winbody">${lines}</div>` +
        `<div class="winstatus"><span>${esc(d.status.left)}</span><span>${esc(d.status.right)}</span></div></div>`;
    },
    card(d) {
      return `<div class="card1 panel el" data-key="${keyOf(d.title)}"><div class="top"><span class="ico">${icon(d.kind)}</span>` +
        (d.pill ? `<span class="pill">${esc(d.pill)}</span>` : '') + `</div>` +
        `<div class="title">${esc(d.title)}</div>` +
        (d.sub ? `<div class="sub">${esc(d.sub)}</div>` : '') + `</div>`;
    },
    list(d) {
      const rows = d.items.map((it) => {
        const colour = it.tone === 'good' ? 'var(--good)' : it.tone === 'bad' ? 'var(--bad)' : 'var(--accent)';
        const glyph = it.tone === 'bad' ? CROSS : CHECK;
        return `<div class="lrow el"><span class="ico">${mark(glyph, colour)}</span>` +
          `<span class="lab">${esc(it.label)}</span></div>`;
      }).join('');
      return `<div class="lst">` + (d.title ? `<div class="hd el">${esc(d.title)}</div>` : '') + rows + `</div>`;
    },
    stat(d) {
      const colour = d.tone === 'good' ? 'var(--good)' : d.tone === 'bad' ? 'var(--bad)' : 'var(--accent)';
      // the number settles and a hairline draws under its label: restraint, not fireworks
      return `<div class="stat" style="color:${colour}">` +
        `<div class="v el" data-v="${esc(d.value)}" data-from="${esc(d.from || '')}" style="color:${colour}">${esc(d.value)}</div>` +
        (d.label ? `<div class="l el">${esc(d.label)}</div>` : '') + `<span class="srule"></span></div>`;
    },
    diff(d) {
      const rows = d.rows.map((r) =>
        `<div class="drow el ${r.tone}">${esc(r.text)}</div>`).join('');
      return `<div class="diff panel el" style="overflow:hidden">` +
        (d.title ? `<div class="hd">${esc(d.title)}</div>` : '') + rows +
        `<div style="height:20px"></div></div>`;
    },
    chart(d) {
      const colour = d.tone === 'good' ? 'var(--good)' : d.tone === 'bad' ? 'var(--bad)' : 'var(--accent)';
      if (d.kind === 'bar') {
        const top = Math.max(...d.bars.map((b) => b.value));
        const bars = d.bars.map((b) =>
          `<div class="bar${b.value === top ? ' top' : ''}" data-value="${b.value}">` +
          `<div class="val">0</div><div class="fill"></div><div class="lab">${esc(b.label)}</div></div>`).join('');
        return `<div class="chart">` + (d.unit ? `<div class="hd">${esc(d.unit.toUpperCase())}</div>` : '') +
          `<div class="bars">${bars}</div></div>`;
      }
      if (d.kind === 'meter') {
        // one cell per unit up to 20, otherwise 20 cells standing in for the range
        const cells = Math.min(20, Math.max(2, Math.round(d.max)));
        const cols = cells <= 10 ? cells : Math.ceil(cells / 2);
        return `<div class="chart meter" data-cells="${cells}">` +
          `<div class="cells" style="grid-template-columns:repeat(${cols},1fr)">` +
          Array.from({ length: cells }, () => '<div class="cell"></div>').join('') + `</div>` +
          `<div class="read" style="color:${colour}"><span class="n">0</span><small> / ${esc(fmtNum(d.max))}</small></div>` +
          (d.label ? `<div class="l">${esc(d.label)}</div>` : '') + `</div>`;
      }
      // line: the SHAPE the narration describes. Only the two real endpoints are
      // printed, so the chart never implies measured data it does not have.
      return `<div class="chart">` + (d.label ? `<div class="hd">${esc(d.label)}</div>` : '') +
        `<svg class="line" viewBox="0 0 600 300" preserveAspectRatio="none">` +
        [60, 150, 240].map((y) => `<line x1="0" x2="600" y1="${y}" y2="${y}" stroke="#e4dfd6" stroke-width="2"/>`).join('') +
        `<path class="area" fill="${colour}" opacity=".09"/>` +
        `<path class="curve" fill="none" stroke="${colour}" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>` +
        `<circle class="head" r="11" fill="${colour}"/></svg>` +
        `<div class="ends"><span class="a">${esc(d.from || '')}</span><span class="b" style="color:${colour}">${esc(d.to || '')}</span></div></div>`;
    },
    sequence(d) {
      const W = 680, n = d.actors.length;
      const xs = d.actors.map((_, i) => n === 2 ? [130, 550][i] : [95, 340, 585][i]);
      const top = 20, y0 = 120, y1 = 470;
      const dy = d.steps.length > 1 ? (y1 - y0) / (d.steps.length - 1) : 0;
      const actors = d.actors.map((a, i) =>
        `<g class="actor el"><rect x="${xs[i] - 90}" y="${top}" width="180" height="56" rx="14"/>` +
        `<text x="${xs[i]}" y="${top + 37}" text-anchor="middle">${esc(a)}</text></g>` +
        `<line class="life" x1="${xs[i]}" x2="${xs[i]}" y1="${top + 64}" y2="512"/>`).join('');
      const msgs = d.steps.map((st, i) => {
        const y = y0 + i * dy, xa = xs[st.from], xb = xs[st.to];
        const dir = Math.sign(xb - xa);
        const x1 = xa + dir * 10, x2 = xb - dir * 16;
        const col = st.tone === 'bad' ? 'var(--bad)' : st.tone === 'good' ? 'var(--good)' : 'var(--accent)';
        // a lost message only gets 60% of the way before it dies
        const xe = st.tone === 'bad' ? x1 + (x2 - x1) * 0.62 : x2;
        const head = st.tone === 'bad'
          ? `<g class="hd" opacity="0"><path d="M${xe - 11},${y + 4} l22,22 M${xe + 11},${y + 4} l-22,22" stroke="var(--bad)" stroke-width="5" stroke-linecap="round" transform="translate(0,-15)"/></g>`
          : `<path class="hd" opacity="0" d="M${x2},${y + 14} l${-dir * 22},-12 l0,24 z" fill="${col}" transform="translate(${dir * 6},-14)"/>`;
        return `<g class="step" data-i="${i}"><path class="msg" d="M${x1},${y} L${xe},${y + 14}" stroke="${col}"` +
          (st.tone === 'bad' ? ' stroke-dasharray="10 9"' : '') + `/>` + head +
          `<text class="lbl" x="${(x1 + xe) / 2}" y="${y - 12}" text-anchor="middle" fill="${col}" opacity="0">${esc(st.label)}</text></g>`;
      }).join('');
      return `<div class="seq"><svg viewBox="0 0 ${W} 520">${actors}${msgs}</svg></div>`;
    },
    cells(d) {
      const n = d.cells.length;
      const rows = n > 10 ? 2 : 1;
      const per = Math.ceil(n / rows);
      const size = Math.min(84, Math.floor((660 - (per - 1) * 8) / per));
      const font = Math.round(size * (Math.max(...d.cells.map((c) => c.length)) > 2 ? 0.34 : 0.48));
      const cell = (c, i) => `<div class="cell" data-i="${i}"><div class="b" style="width:${size}px;height:${Math.round(size * 1.15)}px;font-size:${font}px">${esc(c)}</div>` +
        (d.index ? `<div class="i">${i}</div>` : '') + `</div>`;
      const chunks = [];
      for (let r = 0; r < rows; r++) chunks.push(d.cells.slice(r * per, (r + 1) * per).map((c, j) => cell(c, r * per + j)).join(''));
      const grp = d.group ? `<div class="cells-grp"><span>${esc(d.group.label || '')}</span></div>` : '';
      return `<div class="cellsw" data-size="${size}" data-per="${per}">` +
        chunks.map((c, r) => `<div class="cells-row el">${r === 0 ? '<div class="cells-ptr"></div>' + grp : ''}${c}</div>`).join('') +
        (d.label ? `<div class="cl el">${esc(d.label)}</div>` : '') + `</div>`;
    },
    tree(d) {
      const W = 680, levels = Math.ceil(Math.log2(d.nodes.length + 1));
      const R = levels >= 4 ? 27 : 36, gapY = levels >= 4 ? 118 : 150;
      const pos = d.nodes.map((_, i) => {
        const L = Math.floor(Math.log2(i + 1)), j = i - (2 ** L - 1);
        return { x: ((j + 0.5) / 2 ** L) * W, y: 50 + L * gapY };
      });
      let edges = '', nodes = '';
      d.nodes.forEach((v, i) => {
        if (!v) return;
        if (i > 0) { const pi = Math.floor((i - 1) / 2); edges += `<line class="edge" data-c="${i}" x1="${pos[pi].x}" y1="${pos[pi].y}" x2="${pos[i].x}" y2="${pos[i].y}"/>`; }
        nodes += `<g class="node" data-i="${i}" data-lv="${Math.floor(Math.log2(i + 1))}"><circle cx="${pos[i].x}" cy="${pos[i].y}" r="${R}"/>` +
          `<text x="${pos[i].x}" y="${pos[i].y}" style="font-size:${R >= 36 ? 26 : 21}px">${esc(v)}</text></g>`;
      });
      return `<div class="treew"><svg viewBox="0 0 ${W} ${50 + (levels - 1) * gapY + R + 20}">${edges}${nodes}</svg>` +
        (d.label ? `<div class="tl el">${esc(d.label)}</div>` : '') + `</div>`;
    },
    stack(d) {
      const ns = d.layers.map((l) => l.n);
      const lo = Math.log10(Math.min(...ns)), hi = Math.log10(Math.max(...ns));
      const top = Math.max(...ns);
      const rows = d.layers.map((l) => {
        const f = hi > lo ? (Math.log10(l.n) - lo) / (hi - lo) : 1;
        return `<div class="srow el${l.n === top ? ' top' : ''}" data-w="${(10 + 82 * f).toFixed(1)}">` +
          `<div class="lab">${esc(l.label)}</div><div class="track"><div class="bar"></div><div class="val">${esc(l.value)}</div></div></div>`;
      }).join('');
      return `<div class="stackw">` + (d.title ? `<div class="hd el">${esc(d.title)}</div>` : '') + rows + `</div>`;
    },
    code(d) {
      const K = {
        c: 'int|char|void|return|if|else|for|while|struct|static|const|unsigned|long|size_t|int32_t|int64_t|uint8_t|uint32_t|uint64_t|NULL|sizeof|break|switch|case',
        python: 'def|return|if|elif|else|for|while|in|import|from|as|class|None|True|False|with|try|except|await|async|lambda|not|and|or',
        js: 'const|let|var|function|return|if|else|for|while|await|async|new|class|import|from|export|null|undefined|true|false|try|catch',
        go: 'func|return|if|else|for|range|go|chan|select|defer|var|const|type|struct|interface|nil|map|package|import',
        rust: 'fn|let|mut|return|if|else|for|while|loop|match|impl|struct|enum|pub|use|unsafe|move|async|await|Some|None|Ok|Err',
        java: 'public|private|static|final|void|int|long|return|if|else|for|while|new|class|synchronized|null|true|false|try|catch',
        sql: 'SELECT|FROM|WHERE|UPDATE|SET|INSERT|INTO|VALUES|DELETE|BEGIN|COMMIT|ROLLBACK|FOR|AND|OR|JOIN|ON|CREATE|INDEX|TABLE|LIMIT|ORDER|BY|NOT|NULL|LOCK',
        bash: 'if|then|fi|for|do|done|echo|export|sudo|cd|while',
      }[d.lang] || '';
      const kw = new RegExp(`^(${K})$`);
      const hl = (line) => {
        const cm = d.lang === 'python' || d.lang === 'bash' ? '#' : d.lang === 'sql' ? '--' : '//';
        const ci = line.indexOf(cm);
        const body = ci >= 0 ? line.slice(0, ci) : line, tail = ci >= 0 ? line.slice(ci) : '';
        const html = body.replace(/("[^"]*"|'[^']*'|[A-Za-z_][A-Za-z0-9_]*|\d[\d_.xXa-fA-F]*|[^A-Za-z0-9_"']+)/g, (t, _x, off) => {
          if (/^["']/.test(t)) return `<span class="tk-s">${esc(t)}</span>`;
          if (/^\d/.test(t)) return `<span class="tk-n">${esc(t)}</span>`;
          if (kw.test(t)) return `<span class="tk-k">${esc(t)}</span>`;
          if (/^[A-Za-z_]/.test(t) && body.slice(off + t.length).startsWith('(')) return `<span class="tk-f">${esc(t)}</span>`;
          return esc(t);
        });
        return html + (tail ? `<span class="tk-c">${esc(tail)}</span>` : '');
      };
      const lines = d.lines.map((l, i) =>
        `<div class="ln el" data-n="${i + 1}"><span class="no">${i + 1}</span><span class="tx">${hl(l) || '&nbsp;'}</span></div>`).join('');
      return `<div class="win code el" data-key="${keyOf(d.file)}">` +
        `<div class="wintitle"><span class="lights"><i style="background:#f05b4f"></i><i style="background:#f9bd2e"></i><i style="background:#57c354"></i></span>` +
        `<span>${esc(d.file || d.lang)}</span></div><div class="winbody">${lines}</div></div>`;
    },
    /*
     * stack3d: N plates stacked in space, seen isometrically. One plate is
     * active: it lifts and carries the glow, and the hero stands on it.
     * Plates are listed top first. twin: two small stacks wired along the floor,
     * the opening and closing composition.
     */
    stack3d(d, sc) {
      const plates = d.plates || [];
      const n = plates.length;
      const twin = !!d.twin;
      const P = twin ? 270 : 570, GAP = twin ? 66 : 136;
      const act = Math.max(0, Math.min(n - 1, d.active || 0));
      const g = sc && sc.hero ? heroGrid(sc.hero) : null;
      // standing positions on a plate: u runs across the screen, v toward the
      // viewer, so a row of packets reads as a row whatever the plate's spin
      const at = (u, v) => [P / 2 + (u + v) * 0.7071, P / 2 + (v - u) * 0.7071];
      const rig = (side) => {
        let h = `<div class="s3rig" data-side="${side}">`;
        plates.forEach((pl, i) => {
          let extra = '';
          if (!twin && i === act && g) {
            const k = 370 / HW;
            const [ax, ay] = at(0, 50);
            extra += `<div class="h-anchor s3bb" data-meta="1" data-x="${ax}" data-y="${ay}" style="width:370px;height:${HH * k}px"></div>`;
            for (let j = 0; j < g.n; j++) {
              const c = j % g.cols, r = Math.floor(j / g.cols);
              const [sx, sy] = at((c - (g.cols - 1) / 2) * (g.tw * k * 0.86 + 46), (r - (g.rows - 1) / 2) * 300 + 50);
              extra += `<div class="h-slot s3bb" data-x="${sx}" data-y="${sy}" style="width:${g.tw * k * 0.86}px;height:${g.th * k * 0.86}px"></div>`;
            }
          }
          if (i === n - 1 || (twin && i === 0)) extra += `<i class="s3pt" data-top="${i === 0 ? 1 : 0}" style="left:${P / 2}px;top:${P / 2}px"></i>`;
          h += `<div class="s3plate" data-i="${i}" data-z="${(n - 1 - i) * GAP}" style="width:${P}px;height:${P}px;left:${-P / 2}px;top:${-P / 2}px">` +
            `<div class="s3shad"></div><div class="s3side b"></div><div class="s3side" data-d="10"></div><div class="s3side" data-d="5"></div><div class="s3face"></div>` +
            extra + `</div>`;
        });
        return h + '</div>';
      };
      const tagOf = (pl, i) => pl ? `<b>${esc(pl.n != null ? pl.n : n - i)}</b><div><small>${esc(d.unit || 'LAYER')}</small>` +
        `<span>${esc(pl.label || '')}</span>` + (pl.sub ? `<em>${esc(pl.sub)}</em>` : '') + '</div>' : '';
      if (twin) {
        return `<div class="s3wrap twin"><svg class="s3wire" viewBox="0 0 1080 1920"><path class="glo"/><path class="core"/></svg>` +
          `<div class="s3">${rig('l')}${rig('r')}</div>` +
          `<div class="s3name">${esc(d.twin.left || '')}</div><div class="s3name">${esc(d.twin.right || '')}</div></div>`;
      }
      return `<div class="s3wrap"><div class="s3">${rig('c')}</div>` +
        `<div class="s3tag"><div class="s3t old"></div><div class="s3t new">${tagOf(plates[act], act)}</div></div></div>`;
    },
    /*
     * phone: a handset filling the middle of the frame, with one of four app
     * screens. Data driven; every name, number and app is generic.
     */
    phone(d, sc) {
      const app = d.app || 'chat';
      const sb = `<div class="phsb"><span>${esc(d.clock || '9:41')}</span><span>${SVG_SB}</span></div>`;
      const arrow = '<svg viewBox="0 0 20 20"><path d="M10 16V4M4.5 9.5L10 4l5.5 5.5" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';
      let scr = '';
      if (app === 'chat') {
        const who = d.contact || 'Arjun';
        const msgs = (d.messages || []).map((m, i) => {
          const side = m.from === 'me' ? 'me' : 'them';
          const body = m.photo
            ? `<div class="phimg${sc && sc.hero ? ' h-anchor' : ''}" data-meta="0"${sc && sc.hero ? '' : ` style="background-image:${heroArt({ kind: 'photo' }).replace(/"/g, '&quot;')}"`}></div>`
            : `<span>${esc(m.text)}</span>`;
          return `<div class="bub ${side}${m.photo ? ' pho' : ''}" data-i="${i}"><div class="bb">${body}` +
            `<i class="tm">${esc(m.time || d.clock || '9:41')}${side === 'me' ? SVG_TICK : ''}</i></div></div>`;
        }).join('');
        scr = `<div class="pchd"><svg class="bk" viewBox="0 0 14 22"><path d="M11 2L3 11l8 9" fill="none" stroke="#8a9099" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>` +
          `<span class="av">${esc((d.avatar || who).slice(0, 1).toUpperCase())}</span>` +
          `<span class="who"><b>${esc(who)}</b><small>${esc(d.status || 'online')}</small></span></div>` +
          `<div class="pcmsgs">${msgs}${d.receive ? '<div class="typing"><i></i><i></i><i></i></div>' : ''}</div>` +
          `<div class="pcin"><span class="pl">+</span><span class="fld">Message</span><span class="snd">${arrow}</span></div>`;
      } else if (app === 'pay') {
        scr = `<div class="ppbg"><i></i><i></i><i></i></div><div class="ppsheet"><div class="hdl"></div>` +
          `<div class="pphd"><span class="mk">${icon(d.kind || 'money')}</span>${esc(d.merchant || 'Corner Bakery')}</div>` +
          `<div class="ppamt">${esc(d.amount || '₹450.00')}</div>` +
          (d.note ? `<div class="pprow"><span>For</span><b>${esc(d.note)}</b></div>` : '') +
          `<div class="pprow"><span>From</span><b>${esc(d.method || 'Card •••• 0042')}</b></div>` +
          `<div class="ppbtn"><span class="lb">${esc(d.button || 'Pay')}</span>` +
          `<svg viewBox="0 0 34 34"><circle cx="17" cy="17" r="14" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-dasharray="58 30"/></svg></div>` +
          `<div class="ppok"><svg viewBox="0 0 112 112"><circle class="oc" cx="56" cy="56" r="50" fill="none" stroke="var(--accent)" stroke-width="5" stroke-linecap="round"/>` +
          `<path class="ot" d="M34 57l15 15 29-31" fill="none" stroke="var(--accent)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></svg>` +
          `<b>${esc(d.done || 'Paid')}</b><small>${esc(d.amount || '₹450.00')} to ${esc(d.merchant || 'Corner Bakery')}</small></div></div>`;
      } else if (app === 'notify') {
        let body = esc(d.body || '');
        if (d.code) body = body.replace(esc(d.code), `<span class="otp">${esc(d.code)}</span>`);
        scr = `<div class="pnot"><div class="dt">${esc(d.date || 'Saturday, 3 October')}</div><div class="clk">${esc(d.clock || '9:41')}</div>` +
          `<div class="pban"><span class="ai">${icon(d.kind || 'lock', '#fff')}</span><div class="bt">` +
          `<div class="row"><span>${esc((d.from || 'Messages').toUpperCase())}</span><span>now</span></div>` +
          `<div class="ti">${esc(d.title || '')}</div><div class="bd">${body}</div></div></div></div>`;
      } else {
        scr = `<div class="pbrw"><div class="pbbar"><svg viewBox="0 0 15 16"><rect x="1.5" y="7" width="12" height="8" rx="2" fill="#8a9099"/>` +
          `<path d="M4 7V5a3.5 3.5 0 0 1 7 0v2" fill="none" stroke="#8a9099" stroke-width="1.8"/></svg>${esc(d.url || 'example.com')}</div>` +
          `<div class="pbprog"><i></i></div><div class="pbpage">` +
          `<div class="blk hero" style="background-image:${heroArt({ kind: d.image || 'photo' }).replace(/"/g, '&quot;')}"></div>` +
          `<h3 class="blk">${esc(d.title || '')}</h3><i class="blk"></i><i class="blk" style="width:82%"></i><i class="blk" style="width:64%"></i></div></div>`;
      }
      return `<div class="ph" data-app="${app}"><div class="phglow"></div><div class="phbody"></div>` +
        `<i class="phb a"></i><i class="phb b"></i><i class="phb c"></i>` +
        `<div class="phscr">${sb}${scr}</div><div class="phisland"></div><div class="phhome"></div></div>`;
    },
    note(d) {
      return `<div class="note"><div class="lead el">${esc(d.lead)}</div>` +
        (d.body ? `<div class="body el">${esc(d.body)}</div>` : '') + `</div>`;
    },
  };

  // Building 24 scenes' DOM up front and toggling display is far cheaper per
  // frame than rebuilding innerHTML on every cut, and it keeps the frame loop
  // free of layout thrash.
  const hero = $('hero');
  // world types that draw across the whole frame rather than inside #hero
  const FULL = { stack3d: 1, phone: 1, flow: 1 };
  const isFull = (type) => WORLD && !!FULL[type];
  const builderFor = (type) => (WORLD && type === 'flow' ? flow3d : BUILD[type] || BUILD.note);
  const built = scenes.map((sc) => {
    const wrap = document.createElement('div');
    wrap.style.cssText = 'position:absolute;inset:0;display:none';
    wrap.innerHTML = builderFor(sc.type)(WORLD ? sc.data || {} : sc.data, sc);
    (isFull(sc.type) ? $('wstage') : hero).appendChild(wrap);
    return {
      wrap,
      els: [...wrap.querySelectorAll('.el')],
      wires: [...wrap.querySelectorAll('.wire')],
      lines: [...wrap.querySelectorAll('.winbody .ln')],
      draws: [...wrap.querySelectorAll('.draw')],
      stat: wrap.querySelector('.stat .v'),
      nodes: [...wrap.querySelectorAll('.fnode')],
      morph: new Map(),
    };
  });

  /**
   * Sparse scenes used about half their column and dense ones could spill out
   * of it. Each scene is zoomed once, at build time, to the largest size that
   * still fits. CSS zoom rather than a transform: zoom re-lays out and
   * re-rasterises the text, where a scaled layer renders soft. Stat scenes are
   * left alone, they are already sized to be the loudest thing on screen.
   */
  const FIT = { flow: 1, compare: 1, window: 1, card: 1, list: 1, diff: 1, note: 1, cells: 1, stack: 1, code: 1 };
  /*
   * Big numbers are sized to the column too. A stat is set at 150px to be the
   * loudest thing on screen, but "-2,147,483,648" at 150px is wider than the
   * column and was clipped to "-2,147,483,6". Measured on the FINAL value,
   * since the count-up only ever gets narrower than where it ends.
   */
  function fitNumbers(wrap) {
    const prev = wrap.style.display;
    wrap.style.display = 'flex';
    const room = hero.clientWidth * 0.97;
    for (const el of wrap.querySelectorAll('.stat .v, .chart .ends .b, .meter .read')) {
      // only swap the text when there is a final value to measure; writing
      // textContent back unconditionally flattened the meter readout's inner
      // spans and crashed its animation on the next frame
      const shown = el.dataset.v ? el.textContent : null;
      if (shown !== null) el.textContent = el.dataset.v;
      let px = parseFloat(getComputedStyle(el).fontSize);
      while (el.scrollWidth > room && px > 48) {
        px *= 0.94;
        el.style.fontSize = px.toFixed(1) + 'px';
      }
      if (shown !== null) el.textContent = shown;
    }
    wrap.style.display = prev;
  }

  function fitScene(wrap, type) {
    const child = wrap.firstElementChild;
    if (!child || !FIT[type] || isFull(type)) return 1;
    const prev = wrap.style.display;
    wrap.style.display = 'flex';
    const maxH = hero.clientHeight * 0.94;
    const spills = () => [child, ...child.querySelectorAll('.win, .diff, .ln, .drow, .fnode, .card1, .cmprow, .lrow')]
      .some((e) => e.scrollWidth > e.clientWidth + 1);
    let z = WORLD ? 1.6 : 1.45;
    for (; z > 0.7; z -= 0.05) {
      child.style.zoom = z.toFixed(2);
      if (child.getBoundingClientRect().height <= maxH && !spills()) break;
    }
    child.style.zoom = z.toFixed(2);
    wrap.style.display = prev;
    return z;
  }

  /**
   * Count-ups only work on a value that really is a number, so the leading
   * numeric group is animated and everything around it is preserved verbatim:
   * "40ms" counts, "$0" counts, "ONE LOCK" is left alone.
   */
  function statParts(raw) {
    const m = /^([^0-9]*)([0-9][0-9,]*)(\.[0-9]+)?(.*)$/s.exec(String(raw || ''));
    if (!m) return null;
    const whole = Number(m[2].replace(/,/g, ''));
    if (!Number.isFinite(whole) || whole > 100000) return null;
    return { pre: m[1], n: whole, frac: m[3] || '', post: m[4] || '' };
  }

  const spring = (t) => {
    if (t <= 0) return 0;
    if (t >= 1) return 1;
    return 1 - Math.pow(1 - t, 3) * (0.65 + 0.35 * Math.cos(t * Math.PI * 1.1));
  };
  const clamp01 = (t) => (t < 0 ? 0 : t > 1 ? 1 : t);

  const easeInOut = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);

  /*
   * Line shapes, as normalised height (0 bottom, 1 top) over x in 0..1. These
   * are the shapes a narration describes ("climbs", "spikes", "falls off a
   * cliff"), not data. Only the two endpoint labels are real numbers.
   */
  const SHAPES = {
    rise:     (x) => 0.08 + 0.84 * Math.pow(x, 2.1),
    fall:     (x) => 0.92 - 0.84 * (1 - Math.pow(1 - x, 2.1)),
    plateau:  (x) => 0.08 + 0.76 * (1 - Math.exp(-5 * x)),
    cliff:    (x) => (x < 0.6 ? 0.8 + 0.025 * Math.sin(x * 22) : 0.8 - 0.7 * (1 - Math.exp(-(x - 0.6) * 16))),
    spike:    (x) => 0.12 + 0.8 * Math.exp(-Math.pow((x - 0.68) / 0.075, 2)) + 0.06 * x,
    sawtooth: (x) => 0.14 + 0.68 * ((x * 3) % 1),
  };
  const RISING = { rise: 1, plateau: 1, spike: 1, sawtooth: 1 };

  function initLine(B, d, k) {
    const svg = B.wrap.querySelector('svg.line');
    const f = SHAPES[d.shape] || SHAPES.rise;
    const rnd = window.rng(7919 * (k + 1));
    const N = 72;
    const ys = [];
    const pts = [];
    for (let i = 0; i < N; i++) {
      const x = i / (N - 1);
      const jitter = (rnd() - 0.5) * 0.035;            // a little texture, never a trend
      const yn = Math.min(0.97, Math.max(0.03, f(x) + (i && i < N - 1 ? jitter : 0)));
      ys.push(yn);
      pts.push(`${(x * 600).toFixed(1)} ${(300 - yn * 300).toFixed(1)}`);
    }
    const dpath = 'M ' + pts.join(' L ');
    const curve = svg.querySelector('.curve');
    curve.setAttribute('d', dpath);
    svg.querySelector('.area').setAttribute('d', dpath + ' L 600 300 L 0 300 Z');
    const len = curve.getTotalLength();
    curve.style.strokeDasharray = `${len}`;
    const a = statParts(d.from), b = statParts(d.to);
    const y0 = ys[0];
    const yExt = RISING[d.shape] ? Math.max(...ys) : Math.min(...ys);
    B.line = { curve, area: svg.querySelector('.area'), head: svg.querySelector('.head'),
      len, ys, a, b, y0, yExt, rising: !!RISING[d.shape],
      aEl: B.wrap.querySelector('.ends .a'), bEl: B.wrap.querySelector('.ends .b') };
  }

  function animateChart(B, d, local, span, k, tSec) {
    const colourOf = (tone) => (tone === 'good' ? 'var(--good)' : tone === 'bad' ? 'var(--bad)' : 'var(--accent)');
    if (d.kind === 'line') {
      if (!B.line) initLine(B, d, k);
      const L = B.line;
      const p = easeInOut(clamp01((local - 0.25) / Math.min(span * 0.7, 4)));
      L.curve.style.strokeDashoffset = (L.len * (1 - p)).toFixed(1);
      L.area.style.clipPath = `inset(0 ${(100 - p * 100).toFixed(2)}% 0 0)`;
      const pt = L.curve.getPointAtLength(L.len * p);
      L.head.setAttribute('cx', pt.x.toFixed(1));
      L.head.setAttribute('cy', pt.y.toFixed(1));
      L.head.style.opacity = p > 0 ? 1 : 0;
      // the far label is a live readout that follows the line, when both ends
      // are real numbers; otherwise it simply lands with the line
      if (L.a && L.b) {
        const seen = L.ys.slice(0, Math.max(1, Math.round(p * (L.ys.length - 1)) + 1));
        const ext = L.rising ? Math.max(...seen) : Math.min(...seen);
        const f = clamp01((ext - L.y0) / ((L.yExt - L.y0) || 1));
        const v = L.a.n + (L.b.n - L.a.n) * f;
        L.bEl.textContent = L.b.pre + Math.round(v).toLocaleString('en-US') + (p >= 1 ? L.b.frac : '') + L.b.post;
        L.bEl.style.opacity = p > 0.02 ? 1 : 0;
      } else {
        L.bEl.style.opacity = clamp01((p - 0.8) / 0.2);
      }
      L.aEl.style.opacity = clamp01((local - 0.2) / 0.4);
      return;
    }
    if (d.kind === 'bar') {
      const bars = B.bars || (B.bars = [...B.wrap.querySelectorAll('.bar')]);
      const top = Math.max(...bars.map((b) => +b.dataset.value)) || 1;
      bars.forEach((b, i) => {
        const q = easeInOut(clamp01((local - 0.3 - i * 0.4) / 0.8));
        const v = +b.dataset.value;
        b.querySelector('.fill').style.height = `${((v / top) * 100 * q).toFixed(2)}%`;
        b.querySelector('.val').textContent = fmtNum(Math.round(v * q * 10) / 10);
        b.style.opacity = clamp01((local - 0.2 - i * 0.4) / 0.3);
      });
      return;
    }
    if (d.kind === 'meter') {
      const cells = B.cells || (B.cells = [...B.wrap.querySelectorAll('.cell')]);
      const q = easeInOut(clamp01((local - 0.3) / Math.min(span * 0.55, 3)));
      const lit = Math.round(cells.length * (d.value / d.max) * q);
      const full = lit >= cells.length;
      const pulse = full && d.tone === 'bad' ? 0.78 + 0.22 * Math.sin(tSec * 6) : 1;
      cells.forEach((c, i) => {
        c.style.background = i < lit ? colourOf(d.tone) : '';
        c.style.opacity = i < lit ? pulse : 1;
      });
      B.wrap.querySelector('.meter .n').textContent = fmtNum(Math.round(d.value * q));
    }
  }

  /*
   * Continuity. After layout, every keyed element (a flow node, card, compare
   * side or window) has its on-screen rect recorded. When the same key appears
   * in two consecutive scenes, the new element starts exactly where the old one
   * was drawn and glides to its own place, instead of vanishing and re-entering.
   * Translation is divided by the scene's zoom because a transform inside a
   * zoomed subtree is scaled by that zoom.
   */
  function measureKeys(b) {
    const out = {};
    const prev = b.wrap.style.display;
    b.wrap.style.display = 'flex';
    b.wrap.querySelectorAll('[data-key]').forEach((e) => {
      if (!e.dataset.key) return;
      const r = e.getBoundingClientRect();
      out[e.dataset.key] = { x: r.left, y: r.top, w: r.width, el: e };
    });
    b.wrap.style.display = prev;
    return out;
  }
  function linkScenes() {
    built.forEach((b, i) => {
      const prev = built[i - 1];
      if (!prev) return;
      // The usual rhythm is a diagram, a number or a log, then the diagram
      // again. Look back up to three scenes (about fifteen seconds) for the most
      // recent appearance of each component, so the system returns already in
      // place instead of being drawn from scratch. Further back than that and
      // nobody remembers where it was, so it is simply redrawn.
      const recent = [built[i - 1], built[i - 2], built[i - 3]].filter(Boolean);
      // Returning to the exact same diagram (the same set of components) is
      // continuity however long ago it was shown: its layout has not changed,
      // so it simply comes back in place and the state changes carry the story.
      const mine = Object.keys(b.keys).sort().join('|');
      let same = null;
      if (Object.keys(b.keys).length >= 2) {
        for (let j = i - 1; j >= 0 && !same; j--) {
          if (Object.keys(built[j].keys).sort().join('|') === mine) same = built[j];
        }
      }
      for (const [key, cur] of Object.entries(b.keys)) {
        const hit = recent.find((r) => r.keys[key]) || same;
        const old = hit ? hit.keys[key] : null;
        if (!old || !cur.w) continue;
        b.morph.set(cur.el, {
          dx: (old.x - cur.x) / (b.zoom || 1),
          dy: (old.y - cur.y) / (b.zoom || 1),
          s: old.w / cur.w,
        });
      }
    });
  }

  /* ---- animation for sequence, cells, tree, stack and code ----
   * Timings here are mirrored in factory/sfx.mjs so the sound lands on the
   * frame the thing happens: sequence step i arrives at 0.8 + i*(0.72*span/n),
   * cells flip at span/2, tree path node k lights at 0.9 + k*(0.6*span/len). */
  function animateNew(B, sc, local, span, tSec) {
    const d = sc.data;
    if (sc.type === 'sequence') {
      const steps = B.steps || (B.steps = [...B.wrap.querySelectorAll('.step')].map((g) => {
        const path = g.querySelector('.msg');
        const m = /M([\d.-]+),([\d.-]+) L([\d.-]+),([\d.-]+)/.exec(path.getAttribute('d'));
        return { g, path, head: g.querySelector('.hd'), lbl: g.querySelector('.lbl'), x1: +m[1], y1: +m[2], x2: +m[3], y2: +m[4] };
      }));
      const every = (span * 0.72) / Math.max(1, steps.length);
      steps.forEach((st, i) => {
        const q = easeInOut(clamp01((local - 0.35 - i * every) / 0.45));
        st.path.setAttribute('d', `M${st.x1},${st.y1} L${(st.x1 + (st.x2 - st.x1) * q).toFixed(1)},${(st.y1 + (st.y2 - st.y1) * q).toFixed(1)}`);
        st.path.style.opacity = q > 0 ? 1 : 0;
        st.head.setAttribute('opacity', q >= 1 ? 1 : 0);
        st.lbl.setAttribute('opacity', clamp01((q - 0.3) / 0.5).toFixed(3));
      });
      return;
    }
    if (sc.type === 'cells') {
      if (!B.cellsInit) {
        B.cellsInit = true;
        B.cellEls = [...B.wrap.querySelectorAll('.cell')];
        B.ptr = B.wrap.querySelector('.cells-ptr');
        B.grp = B.wrap.querySelector('.cells-grp');
        const per = +B.wrap.querySelector('.cellsw').dataset.per;
        const box = (i) => { const e = B.cellEls[i]; return { x: e.offsetLeft, w: e.offsetWidth, row: Math.floor(i / per) }; };
        B.cellBox = box;
        if (B.grp && d.group) {
          const a = box(d.group.from), b = box(Math.min(d.group.to, per - 1));
          B.grp.style.left = a.x + 'px'; B.grp.style.width = (b.x + b.w - a.x) + 'px';
        }
      }
      if (B.grp) B.grp.style.opacity = clamp01((local - 0.6) / 0.4).toFixed(3);
      // the pointer visits its indices across the middle of the scene
      const P = d.pointer || [];
      B.cellEls.forEach((e) => e.classList.remove('hot'));
      if (P.length && B.ptr) {
        const t0 = 0.7, t1 = Math.max(t0 + 0.5, span * 0.8);
        const f = clamp01((local - t0) / (t1 - t0)) * (P.length - 1);
        const k = Math.min(P.length - 1, Math.floor(f)), frac = easeInOut(f - k);
        const a = B.cellBox(P[k]), b = B.cellBox(P[Math.min(k + 1, P.length - 1)]);
        if (a.row === 0) {
          B.ptr.style.left = ((a.x + a.w / 2) + ((b.x + b.w / 2) - (a.x + a.w / 2)) * frac).toFixed(1) + 'px';
          B.ptr.style.opacity = local > t0 ? 1 : 0;
        }
        if (local > t0) B.cellEls[frac > 0.5 ? P[Math.min(k + 1, P.length - 1)] : P[k]].classList.add('hot');
      }
      // values change mid-scene with a flip, one cell after another
      if (d.after) {
        const flip = span * 0.5;
        let j = 0;
        B.cellEls.forEach((e, i) => {
          if (d.after[i] === d.cells[i]) return;
          const q = clamp01((local - flip - (j++) * 0.06) / 0.32);
          const b = e.querySelector('.b');
          b.textContent = q < 0.5 ? d.cells[i] : d.after[i];
          b.style.transform = `rotateX(${(q < 0.5 ? q : 1 - q) * 180}deg)`;
          e.classList.toggle('changed', q >= 0.5);
        });
      }
      return;
    }
    if (sc.type === 'tree') {
      const nodes = B.tnodes || (B.tnodes = [...B.wrap.querySelectorAll('.node')]);
      const edges = B.tedges || (B.tedges = [...B.wrap.querySelectorAll('.edge')]);
      nodes.forEach((g) => {
        const q = spring(clamp01((local - 0.2 - (+g.dataset.lv) * 0.22) / 0.4));
        g.style.opacity = clamp01(q * 1.5);
        g.style.transformOrigin = 'center'; g.style.transformBox = 'fill-box';
        g.style.transform = `scale(${(0.6 + 0.4 * q).toFixed(3)})`;
      });
      edges.forEach((e) => { e.style.opacity = clamp01((local - 0.35) / 0.5); });
      const path = d.path || [];
      const every = (span * 0.6) / Math.max(1, path.length);
      const lit = new Set(path.filter((_, k) => local >= 0.9 + k * every));
      nodes.forEach((g) => g.classList.toggle('on', lit.has(+g.dataset.i)));
      edges.forEach((e) => {
        const c = +e.dataset.c, pi = Math.floor((c - 1) / 2);
        e.classList.toggle('on', lit.has(c) && lit.has(pi));
      });
      return;
    }
    if (sc.type === 'stack') {
      const rows = B.srows || (B.srows = [...B.wrap.querySelectorAll('.srow')]);
      rows.forEach((r, i) => {
        const q = easeInOut(clamp01((local - 0.4 - i * 0.45) / 0.7));
        const w = +r.dataset.w * q;
        r.querySelector('.bar').style.width = w.toFixed(2) + '%';
        const v = r.querySelector('.val');
        v.style.left = `calc(${w.toFixed(2)}% + 14px)`;
        v.style.opacity = clamp01((q - 0.75) / 0.25).toFixed(3);
      });
      return;
    }
    if (sc.type === 'code') {
      const lines = B.clines || (B.clines = [...B.wrap.querySelectorAll('.ln')]);
      const focusAt = Math.max(1.2, span * 0.35), badAt = Math.max(focusAt + 0.6, span * 0.6);
      const focus = new Set(d.focus || []);
      lines.forEach((ln) => {
        const n = +ln.dataset.n;
        const on = local >= focusAt && (focus.has(n) || n === d.bad);
        ln.classList.toggle('focus', on && n !== d.bad);
        ln.classList.toggle('badl', d.bad === n && local >= badAt);
        if (local >= focusAt && (focus.size || d.bad) && !on) {
          ln.style.opacity = Math.min(+ln.style.opacity || 1, 1 - 0.62 * clamp01((local - focusAt) / 0.4)).toFixed(3);
        }
      });
    }
  }

  // =================== world theme runtime ===================
  const easeOut = (t) => 1 - Math.pow(1 - clamp01(t), 3);
  const eio = (t) => easeInOut(clamp01(t));
  const lerp = (a, b, t) => a + (b - a) * t;
  const lerpR = (a, b, t) => ({ x: lerp(a.x, b.x, t), y: lerp(a.y, b.y, t), s: lerp(a.s, b.s, t) });

  /* ---- the hero object ----
   * One element per hero key, drawn above the scenes in screen space. Each
   * scene that carries the hero exposes an anchor (.h-anchor, where the whole
   * object stands) and optionally slots (.h-slot, where its packets go). At a
   * cut the hero glides from where it was last drawn to the new anchor, so it
   * visibly travels. Its state is a handful of numbers (scale, scramble,
   * split, labels) that ease from the previous hero scene's values. */
  const parseBytes = (v) => {
    const m = /([\d.,]+)\s*(B|KB|MB|GB)?/i.exec(String(v || ''));
    return m ? parseFloat(m[1].replace(/,/g, '')) * { b: 1, kb: 1e3, mb: 1e6, gb: 1e9 }[(m[2] || 'b').toLowerCase()] : null;
  };
  const fmtBytes = (b) => (b >= 1e9 ? (b / 1e9).toFixed(1) + ' GB' : b >= 1e6 ? (b / 1e6).toFixed(1) + ' MB'
    : b >= 1e3 ? Math.round(b / 1e3) + ' KB' : Math.round(b) + ' B');
  const HSTEP = {
    whole: () => ({ s: 1, e: 0, p: 0, t: 0 }),
    compressed: (q) => ({ ...q, s: 0.72, p: 0, t: 0 }),
    encrypted: (q) => ({ ...q, e: 1 }),
    split: (q) => ({ ...q, p: 1, t: 0 }),
    labelled: (q) => ({ ...q, p: 1, t: 1 }),
  };
  const GLYPHS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/=';
  const heroes = new Map();
  if (WORLD) {
    const last = new Map();
    scenes.forEach((sc) => {
      const h = sc.hero;
      if (!h || !h.key) return;
      const prev = last.get(h.key);
      const from = prev ? prev.to : null;
      const to = (HSTEP[h.state] || HSTEP.whole)(from || HSTEP.whole());
      const b = parseBytes(h.bytes);
      const bTo = b != null ? b : prev ? prev.bTo : null;
      sc._h = { from: from || to, to, bFrom: prev && prev.bTo != null ? prev.bTo : bTo, bTo,
        tagFrom: prev ? prev.tag : (h.tag || '#{i}'), tag: h.tag || (prev && to.t > 0 ? prev.tag : '#{i}') };
      last.set(h.key, sc._h);
      if (heroes.has(h.key)) return;
      const g = heroGrid(h);
      const rootEl = document.createElement('div');
      rootEl.className = 'hobj';
      rootEl.style.opacity = 0;
      let html = `<div class="hpiece hwhole" style="width:${HW}px;height:${HH}px"><div class="himg"></div><div class="gly"></div></div>`;
      for (let j = 0; j < g.n; j++) html += `<div class="hpiece htile" style="width:${g.tw}px;height:${g.th}px;opacity:0"><div class="himg"></div><div class="gly"></div></div>`;
      for (let j = 0; j < g.n; j++) html += '<div class="ttag" style="opacity:0"></div>';
      html += '<div class="hmeta" style="opacity:0"><span></span><b></b></div>';
      rootEl.innerHTML = html;
      $('hobjs').appendChild(rootEl);
      const art = heroArt(h);
      rootEl.querySelectorAll('.himg').forEach((im, j) => {
        im.style.backgroundImage = art;
        im.style.backgroundSize = `${HW}px ${HH}px`;
        if (j) im.style.backgroundPosition = `${-((j - 1) % g.cols) * g.tw}px ${-Math.floor((j - 1) / g.cols) * g.th}px`;
      });
      heroes.set(h.key, { ...g, key: h.key, root: rootEl, whole: rootEl.querySelector('.hwhole'),
        tiles: [...rootEl.querySelectorAll('.htile')], tags: [...rootEl.querySelectorAll('.ttag')],
        meta: rootEl.querySelector('.hmeta'), imgs: [...rootEl.querySelectorAll('.himg')],
        glys: [...rootEl.querySelectorAll('.gly')], last: null, from: null, fade: 0, slot: -1 });
    });
  }

  function heroCut() {
    heroes.forEach((H) => {
      H.from = H.last && H.last.vis > 0.5 ? H.last : null;
      H.fade = H.last ? H.last.vis : 0;
    });
  }

  function heroTarget(H, B, cur) {
    if (B.hAnchor === undefined) {
      B.hAnchor = B.wrap.querySelector('.h-anchor');
      B.hSlots = [...B.wrap.querySelectorAll('.h-slot')];
    }
    if (!B.hAnchor) return null;
    const r = B.hAnchor.getBoundingClientRect();
    if (!r.width) return null;
    const S = (r.width / HW) * cur.s;
    const whole = { x: r.left + r.width / 2 - (HW * S) / 2, y: r.bottom - HH * S, s: S };
    const g = 0.2 * H.tw * S;
    const fanW = H.cols * H.tw * S + (H.cols - 1) * g, fanH = H.rows * H.th * S + (H.rows - 1) * g;
    const tiles = [];
    for (let j = 0; j < H.n; j++) {
      const c = j % H.cols, rr = Math.floor(j / H.cols);
      const home = { x: whole.x + c * H.tw * S, y: whole.y + rr * H.th * S, s: S };
      let to;
      const sl = B.hSlots[j];
      if (sl) {
        const q = sl.getBoundingClientRect();
        const ts = q.width / H.tw;
        to = { x: q.left, y: q.bottom - H.th * ts, s: ts };
      } else {
        to = { x: r.left + r.width / 2 - fanW / 2 + c * (H.tw * S + g), y: r.bottom - fanH + rr * (H.th * S + g), s: S };
      }
      tiles.push(lerpR(home, to, cur.p));
    }
    return { whole, tiles, meta: B.hAnchor.dataset.meta !== '0' };
  }

  const placeEl = (el, r) => { el.style.transform = `translate(${r.x.toFixed(1)}px, ${r.y.toFixed(1)}px) scale(${r.s.toFixed(4)})`; };

  function updateHeroes(sc, B, local, span, tSec) {
    heroes.forEach((H) => {
      const mine = sc.hero && sc.hero.key === H.key && sc._h;
      let cur = null, tgt = null;
      if (mine) {
        const { from, to } = sc._h;
        const t0 = Math.min(1.0, span * 0.22);
        const r = (a, b, d0, dur) => a + (b - a) * easeInOut(clamp01((local - d0) / dur));
