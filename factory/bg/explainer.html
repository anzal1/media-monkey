<!doctype html>
<meta charset="utf-8" />
<title>explainer scene</title>
<style>
  @font-face { font-family: Anton; src: local('Anton'); }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; }
  body {
    background: #f7f5f1;
    font-family: 'Inter', -apple-system, 'Helvetica Neue', Arial, sans-serif;
    color: #171614;
    -webkit-font-smoothing: antialiased;
  }
  #stage { position: relative; width: 1080px; height: 1920px; padding: 310px 70px 0; }
  .eyebrow {
    display: flex; align-items: center; justify-content: space-between;
    font-size: 21px; letter-spacing: .20em; text-transform: uppercase;
    font-weight: 600; color: #8a857c;
  }
  .dots { display: flex; gap: 12px; }
  .dot {
    width: 30px; height: 30px; border-radius: 50%;
    border: 2px solid #ccc7bd; color: #a9a49a;
    font-size: 15px; font-weight: 700; display: grid; place-items: center;
  }
  .dot.on { background: #c2410c; border-color: #c2410c; color: #fff; }
  h1 {
    margin-top: 30px; font-size: 86px; line-height: .98; letter-spacing: -.028em;
    font-weight: 800; max-width: 700px;
  }
  .subhead { margin-top: 22px; font-size: 30px; color: #6f6a61; font-weight: 500; }
  #viewport {
    position: absolute; left: 70px; top: 700px; width: 850px; height: 700px;
    overflow: hidden;
  }
  #diagram { position: absolute; left: 0; top: 0; width: 850px; height: 2400px;
    transform-origin: 0 0; will-change: transform; }
  .node {
    position: absolute; background: #fff; border: 2px solid #e2ded5; border-radius: 18px;
    padding: 22px 26px; box-shadow: 0 10px 30px rgba(30,25,15,.06);
  }
  .node .chip {
    display: inline-block; font-size: 17px; letter-spacing: .06em; color: #8a857c;
    font-weight: 600; margin-bottom: 14px;
  }
  .node .title {
    font-size: 38px; font-weight: 800; letter-spacing: -.02em;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .node .sub {
    font-size: 23px; color: #6f6a61; margin-top: 8px; font-weight: 500;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    overflow: hidden;              /* never spill past the card border */
  }
  .node.accent { border-color: #c2410c; }
  .node.accent .title { color: #c2410c; }
  svg { position: absolute; inset: 0; width: 940px; height: 800px; overflow: visible; }
  .elabel {
    position: absolute; font-size: 19px; font-weight: 700; color: #4a453d;
    background: #f7f5f1; padding: 3px 8px; letter-spacing: .01em;
    max-width: 150px; text-align: center; line-height: 1.18; white-space: normal;
  }
  #mascot {
    position: absolute; right: 74px; top: 316px; height: 250px;
    image-rendering: -webkit-optimize-contrast; pointer-events: none;
  }
  footer {
    position: absolute; left: 70px; right: 70px; bottom: 455px;
    border-top: 2px solid #e2ded5; padding-top: 22px;
    font-size: 20px; letter-spacing: .18em; text-transform: uppercase;
    color: #8a857c; font-weight: 600; display: flex; justify-content: space-between;
  }
</style>
<body>
  <div id="stage">
    <div class="eyebrow"><span id="eyebrow"></span><span class="dots" id="dots"></span></div>
    <h1 id="headline"></h1>
    <div class="subhead" id="subhead"></div>
    <div id="viewport"><div id="diagram"><svg id="wires"></svg></div></div>
    <img id="mascot" src="../../assets/brand/mascot-cut.png" alt="" />
    <footer><span id="episode"></span><span id="counter"></span></footer>
  </div>
<script src="./_harness.js"></script>
<script src="./explainer-spec.js"></script>
<script>
(function () {
  const S = window.SPEC;
  const FPS = 30;
  window.FPS = FPS;
  const TOTAL_STEPS = Math.max(...S.nodes.map(n => n.step)) + 1;
  // Reveal times come from the real TTS segment durations (window.SPEC.stepStarts,
  // seconds), so a node lands exactly as its beat is spoken. Falls back to equal
  // slices when the scene is opened by hand in a browser.
  const SECONDS = Number((/[?&]seconds=(\d+)/.exec(location.search) || [])[1] || 30);
  const starts = Array.isArray(S.stepStarts) && S.stepStarts.length
    ? S.stepStarts
    : Array.from({ length: TOTAL_STEPS }, (_, i) => (i * SECONDS) / TOTAL_STEPS);
  // continuous "step position" for frame i: which reveal are we in, and how far
  const posAt = (frame) => {
    const t = frame / FPS;
    let k = 0;
    while (k + 1 < starts.length && t >= starts[k + 1]) k++;
    const span = (starts[k + 1] ?? starts[k] + 3) - starts[k] || 3;
    return k + Math.min(1, Math.max(0, (t - starts[k]) / span));
  };

  document.getElementById('eyebrow').textContent = S.eyebrow;
  document.getElementById('headline').textContent = S.headline;
  document.getElementById('subhead').textContent = S.subhead || '';
  document.getElementById('episode').textContent = S.episode || '';

  const dots = document.getElementById('dots');
  for (let i = 0; i < TOTAL_STEPS; i++) {
    const d = document.createElement('span');
    d.className = 'dot'; d.textContent = i + 1; d.dataset.step = i;
    dots.appendChild(d);
  }

  const diagram = document.getElementById('diagram');
  // headline runs 2 or 3 lines depending on the topic, so pin the diagram under
  // the real header box instead of a fixed top that sometimes collides
  requestAnimationFrame(() => {
    const sub = document.getElementById('subhead');
    // position the WINDOW under the header; the world inside it is camera-driven
    document.getElementById('viewport').style.top =
      Math.round(sub.getBoundingClientRect().bottom + 56) + 'px';
  });
  const svg = document.getElementById('wires');
  const els = {};
  for (const n of S.nodes) {
    const el = document.createElement('div');
    el.className = 'node' + (n.accent ? ' accent' : '');
    el.style.cssText += `left:${n.x}px;top:${n.y}px;width:${n.w}px;min-height:${n.h}px`;
    el.innerHTML = `<div class="chip">${n.chip || ''}</div><div class="title">${n.title}</div>` +
                   (n.sub ? `<div class="sub">${n.sub}</div>` : '');
    diagram.appendChild(el);
    els[n.id] = { el, n };
  }

  // orthogonal-ish wire between node edges, plus a floating label
  const wires = [];
  for (const e of S.edges) {
    const a = els[e.from].n, b = els[e.to].n;
    const ac = { x: a.x + a.w / 2, y: a.y + a.h / 2 };
    const bc = { x: b.x + b.w / 2, y: b.y + b.h / 2 };
    const horiz = Math.abs(ac.x - bc.x) > Math.abs(ac.y - bc.y);
    const p1 = horiz
      ? { x: ac.x < bc.x ? a.x + a.w : a.x, y: ac.y }
      : { x: ac.x, y: ac.y < bc.y ? a.y + a.h : a.y };
    const p2 = horiz
      ? { x: ac.x < bc.x ? b.x : b.x + b.w, y: bc.y }
      : { x: bc.x, y: ac.y < bc.y ? b.y : b.y + b.h };
    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    const mid = horiz ? `${(p1.x + p2.x) / 2},${p1.y} ${(p1.x + p2.x) / 2},${p2.y}` : `${p1.x},${(p1.y + p2.y) / 2} ${p2.x},${(p1.y + p2.y) / 2}`;
    path.setAttribute('d', `M ${p1.x},${p1.y} L ${mid.split(' ')[0]} L ${mid.split(' ')[1]} L ${p2.x},${p2.y}`);
    path.setAttribute('fill', 'none');
    path.setAttribute('stroke', '#c2410c');
    path.setAttribute('stroke-width', '4');
    path.setAttribute('stroke-linecap', 'round');
    path.setAttribute('stroke-linejoin', 'round');
    svg.appendChild(path);
    const len = path.getTotalLength();
    path.style.strokeDasharray = len;

    const head = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    head.setAttribute('r', '9'); head.setAttribute('fill', '#c2410c');
    svg.appendChild(head);

    let label = null;
    if (e.label) {
      label = document.createElement('div');
      label.className = 'elabel';
      label.textContent = e.label;
      // horizontal wires: lift the label off the line so it never overlaps a node
      const lp = { x: (p1.x + p2.x) / 2, y: (p1.y + p2.y) / 2 - (horiz ? 26 : 0) };
      label.style.cssText += `left:${lp.x}px;top:${lp.y}px;transform:translate(-50%,-50%)`;
      diagram.appendChild(label);
    }
    wires.push({ e, path, head, label, len, p2 });
  }

  const ease = (t) => (t <= 0 ? 0 : t >= 1 ? 1 : 1 - Math.pow(1 - t, 3));
  // slight overshoot: motion that settles reads as crafted rather than linear
  const spring = (t) => {
    if (t <= 0) return 0;
    if (t >= 1) return 1;
    return 1 - Math.pow(1 - t, 3) * Math.cos(t * Math.PI * 1.1) * 0.35 - Math.pow(1 - t, 3) * 0.65;
  };
  const lerp = (a, b, t) => a + (b - a) * t;

  const VIEW_W = 850, VIEW_H = 700;
  let camX = 0, camY = 0, camS = 1, camInit = false;

  window.mmBoot({
    frame(i) {
      const t = posAt(i);                  // continuous step position, speech-timed
      const step = Math.floor(t);
      const tSec = i / FPS;

      // ---- nodes: reveal, then lead or recede based on what is being said
      for (const id in els) {
        const { el, n } = els[id];
        const appear = spring((t - n.step) / 0.5);
        const focus = 1 - Math.min(1, Math.abs(t - 0.35 - n.step) / 1.6);
        const lead = Math.max(0, focus);
        el.style.opacity = appear * (0.4 + 0.6 * Math.max(lead, n.step >= step ? 0.55 : 0.28));
        el.style.transform =
          `translateY(${(1 - appear) * 30}px) scale(${lerp(0.97, 1.03, lead) * (0.6 + 0.4 * appear)})`;
        el.style.boxShadow = lead > 0.35
          ? `0 ${10 + 16 * lead}px ${26 + 30 * lead}px rgba(30,25,15,${0.06 + 0.10 * lead})`
          : '0 8px 20px rgba(30,25,15,.05)';
        el.style.borderColor = lead > 0.45
          ? `rgba(194,65,12,${0.25 + 0.65 * lead})`
          : (n.accent ? '#e6c9b8' : '#e2ded5');
      }

      // ---- wires: draw on reveal, then keep a packet flowing while live
      for (const w of wires) {
        const p = ease((t - w.e.step) / 0.55);
        w.path.style.strokeDashoffset = w.len * (1 - p);
        w.path.style.opacity = p > 0 ? lerp(0.35, 1, Math.max(0, 1 - Math.abs(t - w.e.step) / 1.4)) : 0;
        const live = p >= 1 && Math.abs(t - w.e.step) < 1.5;
        let at = p;
        if (live) at = ((tSec * 0.55) % 1);              // continuous flow
        const pt = p > 0 ? w.path.getPointAtLength(w.len * Math.min(at, 1)) : { x: -60, y: -60 };
        w.head.setAttribute('cx', pt.x);
        w.head.setAttribute('cy', pt.y);
        w.head.style.opacity = p > 0 && (live || p < 1) ? 1 : 0;
        w.head.setAttribute('r', live ? 8 : 9);
        if (w.label) w.label.style.opacity = ease((t - w.e.step - 0.3) / 0.45) * (0.45 + 0.55 * Math.max(0, 1 - Math.abs(t - w.e.step) / 1.5));
      }

      // ---- camera: glide to keep the component being explained in frame
      const cur = S.nodes[Math.min(Math.max(step, 0), S.nodes.length - 1)];
      const nxt = S.nodes[Math.min(step + 1, S.nodes.length - 1)];
      const blend = Math.min(1, Math.max(0, t - step));
      const ty = lerp(cur.y + cur.h / 2, nxt.y + nxt.h / 2, blend * 0.55);
      // The two columns exactly fill the window, so any horizontal pan or zoom
      // would slice a node in half. The camera only travels vertically.
      const wantS = 1;
      const wantX = 0;
      const wantY = Math.min(0, VIEW_H / 2 - ty * wantS);
      const worldW = 850 * wantS;
      const worldH = (Math.max(...S.nodes.map((n) => n.y + n.h)) + 40) * wantS;
      const clampX = (v) => Math.min(0, Math.max(v, VIEW_W - worldW));
      const clampY = (v) => Math.min(0, Math.max(v, Math.min(0, VIEW_H - worldH)));
      const tgtX = clampX(wantX);
      const tgtY = clampY(wantY);
      if (!camInit) { camX = tgtX; camY = tgtY; camS = wantS; camInit = true; }
      camX = lerp(camX, tgtX, 0.055);       // damped glide, never past the edges
      camY = lerp(camY, tgtY, 0.055);
      camS = lerp(camS, wantS, 0.05);
      diagram.style.transform = `translate(${camX.toFixed(2)}px, ${camY.toFixed(2)}px) scale(${camS.toFixed(4)})`;

      [...dots.children].forEach((d) => {
        d.classList.toggle('on', Number(d.dataset.step) <= step);
      });
      document.getElementById('counter').textContent =
        String(Math.min(step + 1, TOTAL_STEPS)).padStart(2, '0') + ' / ' + String(TOTAL_STEPS).padStart(2, '0');
    },
  });
})();
</script>
