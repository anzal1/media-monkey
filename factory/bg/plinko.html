<!doctype html>
<meta charset="utf-8">
<title>mm bg: plinko</title>
<!--
  ENDLESS PLINKO. Marbles pour through a peg pyramid into buckets. A running
  counter at the top increments on every landing and never resets, every bucket
  flashes as it takes a hit, and roughly every ninth marble is gold and detonates
  on landing. Something is always mid-fall and about to land: that is the hook.

  Deterministic: ?seed=N picks the variant, frames step in order, no clock and
  no Math.random.
-->
<style>
  html,body{margin:0;background:#04050a;overflow:hidden}
  canvas{display:block;width:1080px;height:1920px}
</style>
<canvas id="c" width="1080" height="1920"></canvas>
<script src="_harness.js"></script>
<script>
(() => {
  const W = 1080, H = 1920;
  const c = document.getElementById('c');
  const g = c.getContext('2d', { alpha: false });
  const TAU = Math.PI * 2;
  const r = rng(MM_SEED * 1103515245 + 7919);

  // --- field ------------------------------------------------------------
  const ROWS = 12;
  const PEG_R = 9;
  const SPACING = 78;
  const TOP = 470;
  const MARBLE_R = 21;

  const pegs = [];
  for (let row = 0; row < ROWS; row++) {
    const n = row + 3;
    const y = TOP + row * SPACING;
    const x0 = W / 2 - ((n - 1) * SPACING) / 2;
    for (let i = 0; i < n; i++) pegs.push({ x: x0 + i * SPACING, y, hit: 0 });
  }

  const BUCKET_TOP = TOP + ROWS * SPACING + 30;
  const BUCKETS = 11;
  const BW = W / BUCKETS;
  const buckets = [];
  for (let i = 0; i < BUCKETS; i++) {
    buckets.push({ x: i * BW, flash: 0, count: 0 });
  }

  const PALETTE = [
    [16, 96, 60], [190, 92, 62], [288, 88, 66], [148, 86, 56], [42, 96, 62],
  ];
  const GOLD = [46, 100, 62];

  const marbles = [];
  const parts = [];
  let landed = 0;
  let spawnIn = 0;
  let spawnCount = 0;
  let counterPop = 0;
  let goldFlash = 0;

  const GRAV = 0.52;
  const REST = 0.44;
  const SUB = 3;

  function spawn() {
    spawnCount++;
    const gold = spawnCount % 9 === 0;
    const col = gold ? GOLD : PALETTE[Math.floor(r() * PALETTE.length)];
    marbles.push({
      x: W / 2 + (r() - 0.5) * 210,
      y: TOP - 210 - r() * 90,
      vx: (r() - 0.5) * 2.2,
      vy: 1 + r() * 2,
      gold,
      col,
      spin: (r() - 0.5) * 0.2,
      a: r() * TAU,
    });
  }

  function burst(x, y, col, n, power) {
    for (let i = 0; i < n; i++) {
      const a = r() * TAU;
      const sp = power * (0.35 + r());
      parts.push({
        x, y,
        vx: Math.cos(a) * sp,
        vy: Math.sin(a) * sp - power * 0.35,
        life: 1,
        decay: 0.016 + r() * 0.018,
        size: 2 + r() * 4.5,
        col,
      });
    }
  }

  function step() {
    if (--spawnIn <= 0) { spawn(); spawnIn = 17; }

    for (let s = 0; s < SUB; s++) {
      for (let i = marbles.length - 1; i >= 0; i--) {
        const m = marbles[i];
        m.vy += GRAV / SUB;
        m.vx *= 0.9995;
        m.x += m.vx / SUB;
        m.y += m.vy / SUB;
        m.a += m.spin / SUB;

        if (m.x < MARBLE_R) { m.x = MARBLE_R; m.vx = Math.abs(m.vx) * REST; }
        if (m.x > W - MARBLE_R) { m.x = W - MARBLE_R; m.vx = -Math.abs(m.vx) * REST; }

        // pegs: only the rows near the marble can matter
        for (const p of pegs) {
          if (Math.abs(p.y - m.y) > SPACING) continue;
          const dx = m.x - p.x, dy = m.y - p.y;
          const rr = PEG_R + MARBLE_R;
          const d2 = dx * dx + dy * dy;
          if (d2 >= rr * rr) continue;
          const d = Math.sqrt(d2) || 0.001;
          const nx = dx / d, ny = dy / d;
          m.x = p.x + nx * rr;
          m.y = p.y + ny * rr;
          const dot = m.vx * nx + m.vy * ny;
          m.vx = (m.vx - 2 * dot * nx) * REST;
          m.vy = (m.vy - 2 * dot * ny) * REST;
          // deterministic nudge: without it marbles funnel down identical paths
          m.vx += (r() - 0.5) * 3.4;
          m.spin += (r() - 0.5) * 0.12;
          p.hit = 1;
        }

        if (m.y > BUCKET_TOP + 46) {
          const bi = Math.max(0, Math.min(BUCKETS - 1, Math.floor(m.x / BW)));
          const b = buckets[bi];
          b.flash = 1;
          b.count++;
          landed++;
          counterPop = 1;
          if (m.gold) {
            goldFlash = 1;
            burst(m.x, BUCKET_TOP + 20, GOLD, 72, 13);
          } else {
            burst(m.x, BUCKET_TOP + 20, m.col, 16, 5.5);
          }
          marbles.splice(i, 1);
        }
      }
    }

    for (let i = parts.length - 1; i >= 0; i--) {
      const p = parts[i];
      p.vy += 0.22;
      p.x += p.vx; p.y += p.vy;
      p.vx *= 0.985; p.vy *= 0.985;
      p.life -= p.decay;
      if (p.life <= 0) parts.splice(i, 1);
    }
    for (const p of pegs) p.hit *= 0.86;
    for (const b of buckets) b.flash *= 0.9;
    counterPop *= 0.88;
    goldFlash *= 0.93;
    if (marbles.length > 26) marbles.splice(0, marbles.length - 26);
  }

  function hsl(col, l, a) {
    return `hsla(${col[0]},${col[1]}%,${l == null ? col[2] : l}%,${a == null ? 1 : a})`;
  }

  function draw() {
    g.fillStyle = '#04050a';
    g.fillRect(0, 0, W, H);

    // gold hit washes the whole frame
    if (goldFlash > 0.01) {
      const gr = g.createRadialGradient(W / 2, BUCKET_TOP, 40, W / 2, BUCKET_TOP, 1200);
      gr.addColorStop(0, `hsla(46,100%,62%,${0.30 * goldFlash})`);
      gr.addColorStop(1, 'hsla(46,100%,62%,0)');
      g.fillStyle = gr;
      g.fillRect(0, 0, W, H);
    }

    g.globalCompositeOperation = 'lighter';

    // pegs: visible at rest, they are the structure the eye tracks against
    for (const p of pegs) {
      if (p.hit > 0.05) {
        g.fillStyle = `hsla(190,90%,70%,${0.5 * p.hit})`;
        g.beginPath();
        g.arc(p.x, p.y, PEG_R * 3.4, 0, TAU);
        g.fill();
      }
      g.fillStyle = `hsla(200,45%,${64 + 32 * p.hit}%,${0.62 + 0.38 * p.hit})`;
      g.beginPath();
      g.arc(p.x, p.y, PEG_R + 2.5 * p.hit, 0, TAU);
      g.fill();
    }

    // buckets
    for (let i = 0; i < BUCKETS; i++) {
      const b = buckets[i];
      const hgt = 168;
      const grd = g.createLinearGradient(0, BUCKET_TOP, 0, BUCKET_TOP + hgt);
      grd.addColorStop(0, `hsla(200,60%,60%,${0.10 + 0.65 * b.flash})`);
      grd.addColorStop(1, 'hsla(200,60%,60%,0)');
      g.fillStyle = grd;
      g.fillRect(b.x + 4, BUCKET_TOP, BW - 8, hgt);
      g.fillStyle = `hsla(200,70%,72%,${0.42 + 0.58 * b.flash})`;
      g.fillRect(b.x + 4, BUCKET_TOP, BW - 8, 5);
      // side walls so the row reads as buckets rather than a dark band
      g.fillStyle = `hsla(200,55%,64%,${0.16 + 0.5 * b.flash})`;
      g.fillRect(b.x + 2, BUCKET_TOP, 3, hgt * 0.7);
    }

    // particles
    for (const p of parts) {
      g.fillStyle = hsl(p.col, 58 + 34 * p.life, p.life);
      g.beginPath();
      g.arc(p.x, p.y, p.size * (0.4 + p.life), 0, TAU);
      g.fill();
    }

    // marbles
    for (const m of marbles) {
      const rad = MARBLE_R * (m.gold ? 1.16 : 1);
      // a tight halo only: a wide one turns the field into a wall of blobs and
      // the pegs stop reading at all
      const glowR = rad * (m.gold ? 3.1 : 2.3);
      const gr = g.createRadialGradient(m.x, m.y, rad * 0.6, m.x, m.y, glowR);
      gr.addColorStop(0, hsl(m.col, 80, 0.7));
      gr.addColorStop(1, hsl(m.col, null, 0));
      g.fillStyle = gr;
      g.beginPath();
      g.arc(m.x, m.y, glowR, 0, TAU);
      g.fill();
      g.fillStyle = hsl(m.col, m.gold ? 74 : 64, 1);
      g.beginPath();
      g.arc(m.x, m.y, rad, 0, TAU);
      g.fill();
      g.fillStyle = 'rgba(255,255,255,0.85)';
      g.beginPath();
      g.arc(m.x - rad * 0.32, m.y - rad * 0.34, rad * 0.3, 0, TAU);
      g.fill();
    }

    g.globalCompositeOperation = 'source-over';

    // the counter. Big, never resets, pops on every landing.
    const pop = 1 + 0.11 * counterPop;
    g.save();
    g.translate(W / 2, 268);
    g.scale(pop, pop);
    g.textAlign = 'center';
    g.font = '900 168px "Arial Black", Arial, sans-serif';
    g.lineWidth = 12;
    g.strokeStyle = 'rgba(0,0,0,0.85)';
    g.strokeText(String(landed), 0, 0);
    g.fillStyle = goldFlash > 0.25 ? 'hsl(46,100%,66%)' : '#ffffff';
    g.fillText(String(landed), 0, 0);
    g.font = '700 40px "Arial Black", Arial, sans-serif';
    g.fillStyle = 'rgba(255,255,255,0.42)';
    g.fillText('MARBLES LANDED', 0, 62);
    g.restore();
  }

  mmBoot({ frame() { step(); draw(); }, name: 'plinko' });
})();
</script>
